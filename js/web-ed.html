<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mini FS Editor - Monaco ed</title>

<style>
:root {
  --console-h: 150px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Cascadia Code", monospace;
  background: #1e1e1e;
  color: #ddd;
}

#container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ============================================================
 * Sidebar
 * ============================================================ */

#sidebar {
  width: 250px;
  min-width: 0;
  background: #252526;
  border-right: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: width 0.2s ease;
  overflow: hidden;
}

#sidebar.collapsed {
  width: 0;
}

#sidebar-toggle {
  width: 12px;
  background: #333;
  border: none;
  color: #eee;
  cursor: pointer;
  padding: 0;
}

/* ============================================================
 * Main
 * ============================================================ */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

#editor {
  height: calc(100vh - var(--console-h));
  width: 100%;
  transition: height 0.2s ease;
}

/* ============================================================
 * Console
 * ============================================================ */

#console-toggle {
  background: #333;
  border: none;
  color: #eee;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
}

#console {
  height: var(--console-h);
  background: #111;
  border-top: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: height 0.2s ease;
  overflow: hidden;
  position: relative;
}

#console-resizer {
  position: absolute;
  top: -3px;
  left: 0;
  right: 0;
  height: 6px;
  cursor: ns-resize;
  z-index: 100;
  background: transparent;
}

#console-resizer:hover {
  background: #555;
}

#console-resizer.dragging {
  background: #007acc;
}

#console-output {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 6px;
  color: #0f0;
  white-space: pre-wrap;
}

#console-output::-webkit-scrollbar {
  width: 10px;
}

#console-output::-webkit-scrollbar-track {
  background: #111;
}

#console-output::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 5px;
}

#console-output::-webkit-scrollbar-thumb:hover {
  background: #555;
}


#console-input {
  height: 60px;
}

/* ============================================================
 * Toolbar
 * ============================================================ */

#toolbar {
  display: flex;
  justify-content: space-around;
  padding: 6px;
  border-bottom: 1px solid #333;
}

#toolbar button {
  background: none;
  border: none;
  color: #eee;
  font-size: 18px;
  cursor: pointer;
}

/* ============================================================
 * File list
 * ============================================================ */

#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  font-size: 13px;
}

.file-item {
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 3px;
  user-select: none;
}

.file-item:hover {
  background: #333;
}

.file-item.active {
  background: #444;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body>

<div id="container">

  <div id="sidebar">

    <div id="toolbar">
      <button id="btnNew" title="New">✨</button>
      <button id="btnDelete" title="Delete">🗑️</button>
      <button id="btnSave" title="Save (가상FS)">💾</button>
      <button id="btnOpen" title="Open">📂</button>
      <button id="btnDownload" title="Download">⬇️</button>
    </div>

    <div id="file-list" aria-label="Files"></div>

  </div>

  <button id="sidebar-toggle">◀</button>

  <div id="main">

    <div id="editor"></div>

    <button id="console-toggle">
      ▼ Console
    </button>

    <div id="console">

      <div id="console-resizer"></div>

      <div id="console-output"></div>

      <div id="console-input"></div>

    </div>

  </div>

</div>

<input
  type="file"
  id="fileInput"
  style="display:none"
/>

<script>

require.config({
  paths: {
    vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
  }
});


/* ============================================================
 * Monaco / Virtual FS
 * ============================================================ */

let editor = null;
let jsConsole = null;

let currentFile = null;

const files = {};


/* ============================================================
 * ed file name
 *
 * 추가:
 * r / w / f / e 명령에서 사용하는 ed식 현재 파일명
 * ============================================================ */

let edFileName = null;


/* ============================================================
 * Console
 * ============================================================ */

function log(msg) {

  const out =
    document.getElementById("console-output");

  out.textContent +=
    String(msg) + "\n";

  out.scrollTop =
    out.scrollHeight;
}


const origLog = console.log;

console.log = (...args) => {

  origLog(...args);

  log(
    args
      .map(x => String(x))
      .join(" ")
  );
};


/* ============================================================
 * Monaco initialization
 * ============================================================ */

require(
  ["vs/editor/editor.main"],
  function () {

    editor =
      monaco.editor.create(
        document.getElementById("editor"),
        {
          value: "",
          language: "plaintext",
          theme: "vs-dark",
          fontSize: 14,
          wordWrap: "on",
          folding: true,
          minimap: {
            enabled: true
          },
          automaticLayout: false
        }
      );


    jsConsole =
      monaco.editor.create(
        document.getElementById("console-input"),
        {
          value:
            "// ed 명령 예) 1,$p   g/the/t.   s/foo/bar/g",
          language: "javascript",
          theme: "vs-dark",
          fontSize: 13,
          minimap: {
            enabled: false
          },
          lineNumbers: "off",
          automaticLayout: false
        }
      );


    jsConsole.onKeyDown(e => {

      if (
        e.keyCode ===
        monaco.KeyCode.Enter
      ) {

        if (e.shiftKey)
          return;

        const code =
          jsConsole
            .getValue()
            .trim();

        jsConsole.setValue("");

        if (code)
          runCode(code);

        e.preventDefault();

      }

    });


    const ro =
      new ResizeObserver(() => {

        if (editor)
          editor.layout();

        if (jsConsole)
          jsConsole.layout();

      });


    ro.observe(
      document.getElementById("main")
    );

    ro.observe(
      document.getElementById("editor")
    );

    ro.observe(
      document.getElementById("console")
    );


    window.addEventListener(
      "resize",
      () => {

        if (editor)
          editor.layout();

        if (jsConsole)
          jsConsole.layout();

      }
    );


    refreshList();

  }
);


/* ============================================================
 * Virtual FS
 * ============================================================ */

function refreshList() {

  const list =
    document.getElementById("file-list");

  list.innerHTML = "";

  const names =
    Object.keys(files);

  if (!names.length) {

    list.innerHTML =
      "<div style='color:#888;padding:6px'>" +
      "파일이 없습니다. ✨ 또는 📂 버튼을 사용하세요." +
      "</div>";

    return;
  }


  names.forEach(fname => {

    const div =
      document.createElement("div");

    div.className =
      "file-item" +
      (
        fname === currentFile
          ? " active"
          : ""
      );

    div.textContent =
      fname;

    div.onclick =
      () => openFile(fname);

    list.appendChild(div);

  });

}


function detectLanguage(fname) {

  const ext =
    fname
      .split(".")
      .pop()
      .toLowerCase();

  if (ext === "js")
    return "javascript";

  if (ext === "ts")
    return "typescript";

  if (ext === "md")
    return "markdown";

  if (ext === "cs")
    return "csharp";

  if (
    ext === "html" ||
    ext === "htm"
  )
    return "html";

  if (ext === "css")
    return "css";

  if (ext === "json")
    return "json";

  if (ext === "xml")
    return "xml";

  return "plaintext";
}


function setEditorLanguage(fname) {

  if (!editor)
    return;

  monaco.editor.setModelLanguage(
    editor.getModel(),
    detectLanguage(fname)
  );

}


/* ============================================================
 * New
 * ============================================================ */

document
  .getElementById("btnNew")
  .addEventListener(
    "click",
    () => {

      const fname =
        prompt(
          "새 파일 이름:",
          "untitled.txt"
        );

      if (
        !fname ||
        files[fname]
      ) {

        alert("파일 존재");

        return;
      }

      files[fname] = "";

      currentFile =
        fname;

      edFileName =
        fname;

      editor.setValue("");

      setEditorLanguage(fname);

      refreshList();

      log(
        `생성됨: ${fname}`
      );

    }
  );


/* ============================================================
 * Open virtual file
 * ============================================================ */

function openFile(fname) {

  currentFile =
    fname;

  edFileName =
    fname;

  const content =
    files[fname] ?? "";

  editor.setValue(
    content
  );

  setEditorLanguage(fname);

  refreshList();

  log(
    `열림: ${fname}`
  );

}


/* ============================================================
 * Delete
 * ============================================================ */

document
  .getElementById("btnDelete")
  .addEventListener(
    "click",
    () => {

      if (!currentFile) {

        alert(
          "열린 파일 없음"
        );

        return;
      }

      delete files[currentFile];

      currentFile =
        null;

      edFileName =
        null;

      editor.setValue("");

      monaco.editor.setModelLanguage(
        editor.getModel(),
        "plaintext"
      );

      refreshList();

      log(
        "삭제됨 (가상 FS)"
      );

    }
  );


/* ============================================================
 * Save
 * ============================================================ */

document
  .getElementById("btnSave")
  .addEventListener(
    "click",
    () => {

      if (!currentFile) {

        alert(
          "열린 파일 없음"
        );

        return;
      }

      files[currentFile] =
        editor.getValue();

      edFileName =
        currentFile;

      log(
        "저장됨: " +
        currentFile
      );

    }
  );


/* ============================================================
 * Local Open
 * ============================================================ */

document
  .getElementById("btnOpen")
  .addEventListener(
    "click",
    () => {

      const input =
        document.getElementById(
          "fileInput"
        );

      input.value = "";

      input.click();

    }
  );


document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    e => {

      const file =
        e.target.files[0];

      if (!file)
        return;

      const reader =
        new FileReader();

      reader.onload =
        () => {

          files[file.name] =
            reader.result;

          currentFile =
            file.name;

          edFileName =
            file.name;

          editor.setValue(
            reader.result
          );

          setEditorLanguage(
            file.name
          );

          refreshList();

          log(
            `로컬 파일 로드: ${file.name}`
          );

        };

      reader.readAsText(
        file,
        "UTF-8"
      );

    }
  );


/* ============================================================
 * Download
 * ============================================================ */

document
  .getElementById("btnDownload")
  .addEventListener(
    "click",
    () => {

      if (!currentFile) {

        alert(
          "열린 파일 없음"
        );

        return;
      }

      const text =
        editor.getValue();

      const blob =
        new Blob(
          [text],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const a =
        document.createElement(
          "a"
        );

      a.href =
        url;

      a.download =
        currentFile ||
        "untitled.txt";

      a.click();

      URL.revokeObjectURL(
        url
      );

      log(
        `다운로드 완료: ${a.download}`
      );

    }
  );


/* ============================================================
 * Sidebar toggle
 * ============================================================ */

const sidebar =
  document.getElementById(
    "sidebar"
  );

const sidebarToggle =
  document.getElementById(
    "sidebar-toggle"
  );


sidebarToggle.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "collapsed"
    );

    sidebarToggle.textContent =
      sidebar.classList.contains(
        "collapsed"
      )
        ? "▶"
        : "◀";


    requestAnimationFrame(
      () => {

        if (editor)
          editor.layout();

        if (jsConsole)
          jsConsole.layout();

        requestAnimationFrame(
          () => {

            if (editor)
              editor.layout();

            if (jsConsole)
              jsConsole.layout();

          }
        );

      }
    );

  }
);


/* ============================================================
 * Console toggle
 * ============================================================ */

const rootStyle =
  document.documentElement.style;

const toggleBtn =
  document.getElementById(
    "console-toggle"
  );

let consoleCollapsed =
  false;


function setConsoleHeight(px) {

  rootStyle.setProperty(
    "--console-h",
    px
  );

  requestAnimationFrame(
    () => {

      if (editor)
        editor.layout();

      if (jsConsole)
        jsConsole.layout();

      requestAnimationFrame(
        () => {

          if (editor)
            editor.layout();

          if (jsConsole)
            jsConsole.layout();

        }
      );

    }
  );

}


toggleBtn.addEventListener(
  "click",
  () => {

    consoleCollapsed =
      !consoleCollapsed;

    if (consoleCollapsed) {

      setConsoleHeight(
        "0px"
      );

      toggleBtn.textContent =
        "▶ Console";

    }

    else {

      setConsoleHeight(
        "150px"
      );

      toggleBtn.textContent =
        "▼ Console";

    }

  }
);


/* ============================================================
 * Console mouse resize
 * ============================================================ */

const consoleElement =
  document.getElementById(
    "console"
  );

const consoleResizer =
  document.getElementById(
    "console-resizer"
  );

let consoleResizing =
  false;

let consoleResizeStartY =
  0;

let consoleResizeStartHeight =
  0;


consoleResizer.addEventListener(
  "mousedown",
  e => {

    if (consoleCollapsed)
      return;

    consoleResizing =
      true;

    consoleResizeStartY =
      e.clientY;

    consoleResizeStartHeight =
      consoleElement.getBoundingClientRect().height;

    consoleResizer.classList.add(
      "dragging"
    );

    document.body.style.cursor =
      "ns-resize";

    document.body.style.userSelect =
      "none";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  e => {

    if (!consoleResizing)
      return;

    const delta =
      consoleResizeStartY -
      e.clientY;

    let newHeight =
      consoleResizeStartHeight +
      delta;

    const minHeight =
      60;

    const main =
      document.getElementById(
        "main"
      );

    const toggleHeight =
      toggleBtn.getBoundingClientRect().height;

    const minEditorHeight =
      80;

    const maxHeight =
      Math.max(
        minHeight,
        main.clientHeight -
        toggleHeight -
        minEditorHeight
      );

    newHeight =
      Math.max(
        minHeight,
        Math.min(
          newHeight,
          maxHeight
        )
      );

    setConsoleHeight(
      `${Math.round(newHeight)}px`
    );

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (!consoleResizing)
      return;

    consoleResizing =
      false;

    consoleResizer.classList.remove(
      "dragging"
    );

    document.body.style.cursor =
      "";

    document.body.style.userSelect =
      "";

  }
);


/* ============================================================
 * Monaco Adapter
 * ============================================================ */

function readLines() {

  const model =
    editor.getModel();

  return model.getLinesContent();

}


function writeLines(
  lines,
  cursor = 1
) {

  if (
    !Array.isArray(lines) ||
    !lines.length
  ) {
    lines = [""];
  }

  const normalized =
    lines.map(
      x => String(x ?? "")
    );

  const text =
    normalized.join("\n");

  const model =
    editor.getModel();

  const newLineCount =
    Math.max(
      1,
      normalized.length
    );

  const targetLine =
    Math.max(
      1,
      Math.min(
        Number(cursor) || 1,
        newLineCount
      )
    );

  let anchor = 0;

  for (
    let i = 0;
    i < targetLine - 1;
    i++
  ) {

    anchor +=
      normalized[i].length + 1;

  }

  anchor =
    Math.max(
      0,
      Math.min(
        anchor,
        text.length
      )
    );

  editor.pushUndoStop();

  editor.executeEdits(
    "ed",
    [
      {
        range:
          model.getFullModelRange(),

        text,

        forceMoveMarkers:
          true
      }
    ]
  );

  const newModel =
    editor.getModel();

  const line =
    Math.max(
      1,
      Math.min(
        targetLine,
        newModel.getLineCount()
      )
    );

  const column =
    Math.min(
      1,
      newModel.getLineMaxColumn(line)
    );

  editor.setPosition({
    lineNumber: line,
    column
  });

  editor.revealLineInCenter(
    line
  );

  editor.pushUndoStop();

}


function currentLine() {

  if (!editor)
    return 1;

  return editor
    .getPosition()
    .lineNumber;

}


function moveCursor(n) {

  const model =
    editor.getModel();

  n =
    Math.max(
      1,
      Math.min(
        n,
        model.getLineCount()
      )
    );

  editor.setPosition({
    lineNumber: n,
    column: 1
  });

  editor.revealLineInCenter(
    n
  );

}


/* ============================================================
 * 내부 buffer
 * ============================================================ */

let buffer = null;
let current = 1;
let nextId = 1;


function makeLine(text) {

  return {
    id: nextId++,
    text: String(text ?? "")
  };

}


function syncBuffer() {

  const lines =
    readLines();

  buffer =
    lines.map(makeLine);

  current =
    Math.max(
      1,
      Math.min(
        currentLine(),
        buffer.length
      )
    );

}


function ensureBuffer() {

  if (!buffer)
    syncBuffer();

}


function lineCount() {

  ensureBuffer();

  return buffer.length;

}


function getLine(n) {

  ensureBuffer();

  if (
    !Number.isInteger(n) ||
    n < 1 ||
    n > buffer.length
  ) {
    throw Error(
      `잘못된 줄 주소: ${n}`
    );
  }

  return buffer[n - 1];

}


function lineIndexById(id) {

  ensureBuffer();

  return buffer.findIndex(
    x => x.id === id
  );

}


function lineNumberById(id) {

  const i =
    lineIndexById(id);

  return i < 0
    ? null
    : i + 1;

}


function setCurrent(n) {

  ensureBuffer();

  if (!buffer.length) {

    current = 0;

    return;
  }

  current =
    Math.max(
      1,
      Math.min(
        n,
        buffer.length
      )
    );

}


function commit() {

  ensureBuffer();

  writeLines(
    buffer.map(
      x => x.text
    ),
    Math.max(
      1,
      Math.min(
        current || 1,
        buffer.length
      )
    )
  );

}


/* ============================================================
 * 문자열
 * ============================================================ */

function quoted(s) {

  s = s.trim();

  if (
    s.length < 2 ||
    !(
      (
        s[0] === '"' &&
        s.at(-1) === '"'
      ) ||
      (
        s[0] === "'" &&
        s.at(-1) === "'"
      )
    )
  ) {

    throw Error(
      '문자열은 "..." 형식이어야 합니다.'
    );

  }

  return s
    .slice(1, -1)
    .replace(
      /\\n/g,
      "\n"
    )
    .replace(
      /\\r/g,
      "\r"
    )
    .replace(
      /\\t/g,
      "\t"
    )
    .replace(
      /\\"/g,
      '"'
    )
    .replace(
      /\\'/g,
      "'"
    )
    .replace(
      /\\\\/g,
      "\\"
    );

}


/* ============================================================
 * 주소
 * ============================================================ */

function readDelimited(
  s,
  p,
  delimiter
) {

  let value = "";

  while (
    p < s.length
  ) {

    const c =
      s[p++];

    if (c === "\\") {

      if (
        p >= s.length
      ) {

        throw Error(
          "주소 정규식이 닫히지 않았습니다."
        );

      }

      value +=
        "\\" + s[p++];

      continue;
    }

    if (
      c === delimiter
    ) {

      return {
        value,
        end: p
      };

    }

    value += c;

  }

  throw Error(
    "주소 정규식이 닫히지 않았습니다."
  );

}


function searchAddress(
  re,
  base,
  direction
) {

  ensureBuffer();

  if (!re)
    re = lastRegex;

  if (!re) {

    throw Error(
      "이전 정규식이 없습니다."
    );

  }

  lastRegex = re;

  let rx;

  try {

    rx =
      new RegExp(re);

  }

  catch (e) {

    throw Error(
      `잘못된 정규식: ${e.message}`
    );

  }

  let n = base;

  for (
    let i = 0;
    i < buffer.length;
    i++
  ) {

    n += direction;

    if (
      n > buffer.length
    )
      n = 1;

    if (n < 1)
      n = buffer.length;

    rx.lastIndex = 0;

    if (
      rx.test(
        buffer[n - 1].text
      )
    )
      return n;

  }

  throw Error(
    `정규식에 일치하는 줄이 없습니다: /${re}/`
  );

}


function parseAddressAt(
  s,
  pos = 0,
  base = current
) {

  ensureBuffer();

  while (
    pos < s.length &&
    /\s/.test(s[pos])
  )
    pos++;

  if (
    pos >= s.length
  ) {

    return {
      value: base,
      end: pos,
      present: false
    };

  }

  let n;
  let present = true;

  const c =
    s[pos];

  if (c === ".") {

    n = base;
    pos++;

  }

  else if (c === "$") {

    n = buffer.length;
    pos++;

  }

  else if (c === "0") {

    n = 0;
    pos++;

  }

  else if (
    /[0-9]/.test(c)
  ) {

    const m =
      s
        .slice(pos)
        .match(/^\d+/);

    n =
      Number(m[0]);

    pos +=
      m[0].length;

  }

  else if (
    c === "/" ||
    c === "?"
  ) {

    const delimiter =
      c;

    const r =
      readDelimited(
        s,
        pos + 1,
        delimiter
      );

    n =
      searchAddress(
        r.value,
        base,
        delimiter === "/"
          ? 1
          : -1
      );

    pos =
      r.end;

  }

  else if (
    c === "+" ||
    c === "-"
  ) {

    n = base;

  }

  else {

    return {
      value: base,
      end: pos,
      present: false
    };

  }


  while (
    pos < s.length
  ) {

    while (
      pos < s.length &&
      /\s/.test(s[pos])
    )
      pos++;

    if (
      s[pos] !== "+" &&
      s[pos] !== "-"
    )
      break;

    const sign =
      s[pos++] === "+"
        ? 1
        : -1;

    const m =
      s
        .slice(pos)
        .match(/^\d+/);

    const amount =
      m
        ? Number(m[0])
        : 1;

    if (m)
      pos +=
        m[0].length;

    n +=
      sign * amount;

  }


  if (
    n < 0 ||
    n > buffer.length
  ) {

    throw Error(
      `잘못된 줄 주소: ${n}`
    );

  }


  return {
    value: n,
    end: pos,
    present
  };

}


function parseRangeAt(
  s,
  pos = 0,
  defaultAddr = "."
) {

  ensureBuffer();

  const startPos =
    pos;

  while (
    pos < s.length &&
    /\s/.test(s[pos])
  )
    pos++;


  if (
    s[pos] === "," ||
    s[pos] === ";"
  ) {

    const separator =
      s[pos++];

    const first =
      separator === ","
        ? 1
        : current;

    const second =
      buffer.length;

    return {
      s: first,
      e: second,
      end: pos,
      present: true
    };

  }


  if (
    pos >= s.length
  ) {

    const n =
      parseAddress(
        defaultAddr
      );

    return {
      s: n,
      e: n,
      end: pos,
      present: false
    };

  }


  const first =
    parseAddressAt(
      s,
      pos,
      current
    );


  if (
    !first.present
  ) {

    const n =
      parseAddress(
        defaultAddr
      );

    return {
      s: n,
      e: n,
      end: startPos,
      present: false
    };

  }


  pos =
    first.end;


  while (
    pos < s.length &&
    /\s/.test(s[pos])
  )
    pos++;


  if (
    s[pos] !== "," &&
    s[pos] !== ";"
  ) {

    return {
      s: first.value,
      e: first.value,
      end: pos,
      present: true
    };

  }


  const separator =
    s[pos++];


  const second =
    parseAddressAt(
      s,
      pos,
      separator === ";"
        ? first.value
        : current
    );


  if (
    !second.present
  ) {

    throw Error(
      "두 번째 주소가 없습니다."
    );

  }


  pos =
    second.end;


  if (
    separator === ";"
  )
    setCurrent(
      first.value
    );


  if (
    first.value >
    second.value
  ) {

    throw Error(
      "잘못된 줄 범위입니다."
    );

  }


  return {
    s: first.value,
    e: second.value,
    end: pos,
    present: true
  };

}


function parseAddress(
  s,
  base = current
) {

  ensureBuffer();

  const text =
    String(s ?? "");

  const r =
    parseAddressAt(
      text,
      0,
      base
    );


  if (
    !r.present
  ) {

    throw Error(
      `잘못된 주소: ${s}`
    );

  }


  if (
    text
      .slice(r.end)
      .trim()
  ) {

    throw Error(
      `잘못된 주소: ${s}`
    );

  }


  return r.value;

}


function getRange(
  s,
  defaultAddr = "."
) {

  ensureBuffer();

  const text =
    String(s ?? "");


  if (
    text.trim() === ","
  ) {

    return {
      s: 1,
      e: buffer.length
    };

  }


  if (
    text.trim() === ";"
  ) {

    return {
      s: current,
      e: buffer.length
    };

  }


  const r =
    parseRangeAt(
      text,
      0,
      defaultAddr
    );


  if (
    text
      .slice(r.end)
      .trim()
  ) {

    throw Error(
      `잘못된 주소: ${s}`
    );

  }


  return {
    s: r.s,
    e: r.e
  };

}


/* ============================================================
 * 출력
 * ============================================================ */

function printCommand(
  addr,
  numbered = false,
  list = false
) {

  const { s, e } =
    getRange(
      addr,
      "."
    );


  for (
    let n = s;
    n <= e;
    n++
  ) {

    let text =
      getLine(n).text;


    if (list) {

      text =
        text
          .replace(
            /\\/g,
            "\\\\"
          )
          .replace(
            /\t/g,
            "\\t"
          )
          .replace(
            /\r/g,
            "\\r"
          )
          .replace(
            /[\x00-\x1f\x7f-\x9f]/g,
            c => {

              if (
                c === "\n"
              )
                return "\\n";

              return (
                "\\x" +
                c
                  .codePointAt(0)
                  .toString(16)
                  .padStart(
                    2,
                    "0"
                  )
              );

            }
          );


      console.log(
        `${text}$`
      );

    }

    else if (numbered) {

      console.log(
        `${n}\t${text}`
      );

    }

    else {

      console.log(
        text
      );

    }

  }


  setCurrent(e);

  return e;

}


/* ============================================================
 * 기본 편집
 * ============================================================ */

function deleteCommand(addr) {

  const { s, e } =
    getRange(
      addr,
      "."
    );


  buffer.splice(
    s - 1,
    e - s + 1
  );


  if (
    !buffer.length
  ) {

    buffer.push(
      makeLine("")
    );

    setCurrent(1);

    return 1;
  }


  setCurrent(
    Math.min(
      s,
      buffer.length
    )
  );


  return current;

}


function splitText(text) {

  return String(text)
    .replace(
      /\r\n/g,
      "\n"
    )
    .replace(
      /\r/g,
      "\n"
    )
    .split("\n");

}


function insertCommand(
  addr,
  text
) {

  const n =
    parseAddress(
      addr || "."
    );


  const items =
    splitText(text)
      .map(makeLine);


  buffer.splice(
    n - 1,
    0,
    ...items
  );


  setCurrent(
    n +
    items.length -
    1
  );


  return current;

}


function appendCommand(
  addr,
  text
) {

  const n =
    parseAddress(
      addr || "."
    );


  const items =
    splitText(text)
      .map(makeLine);


  buffer.splice(
    n,
    0,
    ...items
  );


  setCurrent(
    n +
    items.length
  );


  return current;

}


function changeCommand(
  addr,
  text
) {

  const { s, e } =
    getRange(
      addr,
      "."
    );


  const items =
    splitText(text)
      .map(makeLine);


  buffer.splice(
    s - 1,
    e - s + 1,
    ...items
  );


  if (items.length) {

    setCurrent(
      s +
      items.length -
      1
    );

  }

  else {

    setCurrent(
      Math.min(
        s,
        buffer.length
      )
    );

  }


  return current;

}


/* ============================================================
 * j
 * ============================================================ */

function joinCommand(addr) {

  ensureBuffer();

  let s;
  let e;


  if (
    addr == null ||
    String(addr).trim() === ""
  ) {

    s = current;
    e = current + 1;

  }

  else {

    const range =
      getRange(
        addr,
        "."
      );

    s = range.s;
    e = range.e;

    if (
      s === e
    )
      e = s + 1;

  }


  if (
    s < 1 ||
    s > buffer.length
  ) {

    throw Error(
      `잘못된 줄 주소: ${s}`
    );

  }


  if (
    e > buffer.length
  )
    e = buffer.length;


  if (
    s === e
  ) {

    setCurrent(s);

    return s;
  }


  const text =
    buffer
      .slice(
        s - 1,
        e
      )
      .map(
        x => x.text
      )
      .join("");


  const joined =
    makeLine(text);


  buffer.splice(
    s - 1,
    e - s + 1,
    joined
  );


  setCurrent(s);

  return s;

}


/* ============================================================
 * t
 * ============================================================ */

function copyCommand(
  addr,
  dest
) {

  const { s, e } =
    getRange(
      addr,
      "."
    );


  const target =
    parseAddress(
      dest,
      current
    );


  if (
    target === 0
  ) {

    const copies =
      buffer
        .slice(
          s - 1,
          e
        )
        .map(
          x =>
            makeLine(x.text)
        );


    buffer.splice(
      0,
      0,
      ...copies
    );


    setCurrent(
      copies.length
    );


    return current;

  }


  if (
    target >= s &&
    target <= e &&
    !(
      s === e &&
      target === s
    )
  ) {

    throw Error(
      "복사 대상이 원본 범위 안에 있습니다."
    );

  }


  const copies =
    buffer
      .slice(
        s - 1,
        e
      )
      .map(
        x =>
          makeLine(x.text)
      );


  buffer.splice(
    target,
    0,
    ...copies
  );


  setCurrent(
    target +
    copies.length
  );


  return current;

}


/* ============================================================
 * m
 * ============================================================ */

function moveCommand(
  addr,
  dest
) {

  const { s, e } =
    getRange(
      addr,
      "."
    );


  const target =
    parseAddress(
      dest,
      current
    );


  if (
    target >= s &&
    target <= e
  ) {

    throw Error(
      "이동 대상이 원본 범위 안에 있습니다."
    );

  }


  const count =
    e - s + 1;


  const moved =
    buffer.splice(
      s - 1,
      count
    );


  let insertAt;


  if (
    target < s
  )
    insertAt = target;

  else
    insertAt =
      target - count;


  buffer.splice(
    insertAt,
    0,
    ...moved
  );


  setCurrent(
    insertAt + count
  );


  return current;

}


/* ============================================================
 * Substitute parser
 * ============================================================ */

const ESC = "\uFFFF";

let lastRegex = "";
let lastSubstitution = null;


function parseSubstitute(s) {

  if (
    s[0] !== "s"
  ) {

    throw Error(
      "잘못된 substitute 명령입니다."
    );

  }


  const delimiter =
    s[1];


  if (!delimiter) {

    throw Error(
      "s 구분자가 없습니다."
    );

  }


  let p = 2;
  const parts = [];


  for (
    let field = 0;
    field < 2;
    field++
  ) {

    let value = "";
    let closed = false;


    while (
      p < s.length
    ) {

      const c =
        s[p];


      if (
        c === "\\"
      ) {

        if (
          p + 1 >= s.length
        ) {

          throw Error(
            "substitute escape가 닫히지 않았습니다."
          );

        }


        const n =
          s[p + 1];


        if (
          n === "\n"
        ) {

          value +=
            ESC + "\n";

          p += 2;

          continue;

        }


        if (
          n === "\r" &&
          s[p + 2] === "\n"
        ) {

          value +=
            ESC + "\n";

          p += 3;

          continue;

        }


        value +=
          ESC + n;

        p += 2;

        continue;

      }


      if (
        c === delimiter
      ) {

        p++;

        closed = true;

        break;

      }


      value += c;

      p++;

    }


    if (!closed) {

      throw Error(
        "substitute 구분자가 닫히지 않았습니다."
      );

    }


    parts.push(value);

  }


  let flags = "";


  while (
    p < s.length &&
    /[0-9gGpPlnIi]/.test(
      s[p]
    )
  ) {

    const f =
      s[p++];


    if (
      flags.includes(f)
    ) {

      throw Error(
        `중복 substitute flag: ${f}`
      );

    }


    flags += f;

  }


  if (
    s
      .slice(p)
      .trim()
  ) {

    throw Error(
      `잘못된 substitute suffix: ${s.slice(p)}`
    );

  }


  return {
    delimiter,
    pattern: parts[0],
    replacement: parts[1],
    flags
  };

}


function decodeSubPattern(
  s,
  delimiter
) {

  let out = "";


  for (
    let i = 0;
    i < s.length;
    i++
  ) {

    const c =
      s[i];


    if (
      c !== ESC
    ) {

      out += c;

      continue;

    }


    const n =
      s[++i];


    if (
      n === delimiter
    )
      out += delimiter;

    else if (
      n === "\n"
    )
      out += "\n";

    else
      out +=
        "\\" + n;

  }


  return out;

}


function decodeSubReplacement(
  s,
  delimiter
) {

  let out = "";


  for (
    let i = 0;
    i < s.length;
    i++
  ) {

    const c =
      s[i];


    if (
      c !== ESC
    ) {

      out += c;

      continue;

    }


    const n =
      s[++i];


    if (
      n === "\n"
    ) {

      out += "\n";

      continue;

    }


    if (
      n === delimiter
    ) {

      out += delimiter;

      continue;

    }


    if (
      /[1-9]/.test(n)
    ) {

      out +=
        "$" + n;

      continue;

    }


    if (
      n === "&"
    ) {

      out += "$&";

      continue;

    }


    out += n;

  }


  return out;

}


function jsReplacementToText(
  old,
  regex,
  replacement
) {

  return old.replace(
    regex,
    replacement
  );

}


function substituteCommand(
  addr,
  command
) {

  const sub =
    parseSubstitute(command);


  let pattern =
    decodeSubPattern(
      sub.pattern,
      sub.delimiter
    );


  if (!pattern)
    pattern = lastRegex;


  if (!pattern) {

    throw Error(
      "이전 정규식이 없습니다."
    );

  }


  lastRegex =
    pattern;


  const replacement =
    decodeSubReplacement(
      sub.replacement,
      sub.delimiter
    );


  const flags =
    sub.flags;


  const globalFlag =
    flags.includes("g");


  const ignoreCase =
    flags.includes("I") ||
    flags.includes("i");


  const regexFlags =
    (
      globalFlag
        ? "g"
        : ""
    ) +
    (
      ignoreCase
        ? "i"
        : ""
    );


  let re;


  try {

    re =
      new RegExp(
        pattern,
        regexFlags
      );

  }

  catch (e) {

    throw Error(
      `잘못된 정규식: ${e.message}`
    );

  }


  const range =
    getRange(
      addr,
      "."
    );


  const start =
    range.s;

  const originalEnd =
    range.e;


  let n =
    start;


  let changed = false;

  let lastChanged =
    current;


  while (
    n <= originalEnd &&
    n <= buffer.length
  ) {

    const item =
      buffer[n - 1];


    re.lastIndex = 0;


    const old =
      item.text;


    const neu =
      jsReplacementToText(
        old,
        re,
        replacement
      );


    if (
      old === neu
    ) {

      n++;

      continue;

    }


    changed = true;


    const newTexts =
      splitText(neu);


    const newItems =
      newTexts.map(
        makeLine
      );


    buffer.splice(
      n - 1,
      1,
      ...newItems
    );


    lastChanged =
      n +
      newItems.length -
      1;


    n =
      lastChanged + 1;

  }


  if (!changed) {

    throw Error(
      "치환 없음"
    );

  }


  setCurrent(
    lastChanged
  );


  lastSubstitution = {
    pattern,
    replacement,
    global: globalFlag
  };


  if (
    flags.includes("p")
  )
    printCommand(
      String(current),
      false,
      false
    );


  if (
    flags.includes("n")
  )
    printCommand(
      String(current),
      true,
      false
    );


  if (
    flags.includes("l")
  )
    printCommand(
      String(current),
      false,
      true
    );


  return current;

}


/* ============================================================
 * Global parser
 * ============================================================ */

function parseGlobalHeader(code) {

  const type =
    code[0];


  if (
    type !== "g" &&
    type !== "v"
  ) {

    throw Error(
      "잘못된 global 명령입니다."
    );

  }


  const delimiter =
    code[1];


  if (!delimiter) {

    throw Error(
      "global 구분자가 없습니다."
    );

  }


  let p = 2;
  let pattern = "";


  while (
    p < code.length
  ) {

    const c =
      code[p++];


    if (
      c === "\\"
    ) {

      if (
        p >= code.length
      ) {

        throw Error(
          "global 정규식 escape가 닫히지 않았습니다."
        );

      }


      pattern +=
        "\\" + code[p++];

      continue;

    }


    if (
      c === delimiter
    )
      break;


    pattern += c;

  }


  if (
    p > code.length ||
    code[p - 1] !== delimiter
  ) {

    throw Error(
      "global 정규식이 닫히지 않았습니다."
    );

  }


  return {
    type,
    delimiter,
    pattern,
    restStart: p
  };

}


function scanSubstituteCommand(
  text,
  start
) {

  const delimiter =
    text[start + 1];


  if (!delimiter) {

    throw Error(
      "substitute 구분자가 없습니다."
    );

  }


  let p =
    start + 2;


  for (
    let field = 0;
    field < 2;
    field++
  ) {

    let closed = false;


    while (
      p < text.length
    ) {

      const c =
        text[p];


      if (
        c === "\\"
      ) {

        if (
          text[p + 1] === "\r" &&
          text[p + 2] === "\n"
        )
          p += 3;

        else
          p += 2;

        continue;

      }


      if (
        c === delimiter
      ) {

        p++;

        closed = true;

        break;

      }


      p++;

    }


    if (!closed) {

      throw Error(
        "global 내부 substitute가 닫히지 않았습니다."
      );

    }

  }


  while (
    p < text.length &&
    /[0-9gGpPlnIi]/.test(
      text[p]
    )
  )
    p++;


  return p;

}


function splitGlobalCommands(
  text
) {

  const result = [];

  let start = 0;
  let p = 0;


  while (
    p < text.length
  ) {

    const c =
      text[p];


    if (
      c === "s" &&
      p + 1 < text.length
    ) {

      p =
        scanSubstituteCommand(
          text,
          p
        );

      continue;

    }


    if (
      c === "\\" &&
      (
        text[p + 1] === "\n" ||
        (
          text[p + 1] === "\r" &&
          text[p + 2] === "\n"
        )
      )
    ) {

      const command =
        text
          .slice(
            start,
            p
          )
          .trim();


      if (command)
        result.push(command);


      if (
        text[p + 1] === "\r"
      )
        p += 3;

      else
        p += 2;


      start = p;

      continue;

    }


    if (
      c === "\n"
    ) {

      const command =
        text
          .slice(
            start,
            p
          )
          .trim();


      if (command)
        result.push(command);


      p++;

      start = p;

      continue;

    }


    p++;

  }


  const last =
    text
      .slice(start)
      .trim();


  if (last)
    result.push(last);


  return result;

}


/* ============================================================
 * global
 * ============================================================ */

function globalCommand(
  addr,
  code
) {

  const g =
    parseGlobalHeader(code);


  let pattern =
    decodeSubPattern(
      g.pattern,
      g.delimiter
    );


  if (!pattern)
    pattern = lastRegex;


  if (!pattern) {

    throw Error(
      "이전 정규식이 없습니다."
    );

  }


  lastRegex =
    pattern;


  let re;


  try {

    re =
      new RegExp(pattern);

  }

  catch (e) {

    throw Error(
      `잘못된 global 정규식: ${e.message}`
    );

  }


  const { s, e } =
    getRange(
      addr,
      "1,$"
    );


  const markedIds = [];


  for (
    let n = s;
    n <= e;
    n++
  ) {

    re.lastIndex = 0;


    const matched =
      re.test(
        buffer[n - 1].text
      );


    const select =
      g.type === "g"
        ? matched
        : !matched;


    if (select)
      markedIds.push(
        buffer[n - 1].id
      );

  }


  let commandText =
    code.slice(
      g.restStart
    );


  if (
    !commandText.trim()
  )
    commandText = "p";


  const commands =
    splitGlobalCommands(
      commandText
    );


  if (!commands.length)
    commands.push("p");


  let lastResult =
    current;


  for (
    const id of markedIds
  ) {

    const index =
      lineIndexById(id);


    if (
      index < 0
    )
      continue;


    setCurrent(
      index + 1
    );


    for (
      const command of commands
    ) {

      if (!command)
        continue;


      const trimmed =
        command.trim();


      if (
        /^[gv][/?]/.test(
          trimmed
        )
      ) {

        throw Error(
          "global 안에서 global/vglobal은 사용할 수 없습니다."
        );

      }


      lastResult =
        execute(
          trimmed,
          String(current)
        );

    }

  }


  return lastResult;

}


/* ============================================================
 * 주소 + command 분리
 * ============================================================ */

function splitAddressAndCommand(
  code
) {

  const r =
    parseRangeAt(
      code,
      0,
      "."
    );


  if (
    !r.present
  ) {

    return {
      addr: null,
      rest: code.trim()
    };

  }


  return {

    addr:
      code
        .slice(
          0,
          r.end
        )
        .trim(),

    rest:
      code
        .slice(
          r.end
        )
        .trimStart()

  };

}


/* ============================================================
 * ed file commands
 *
 * 추가된 부분
 *
 * r  : virtual FS 파일을 현재 버퍼 뒤에 읽기
 * w  : 현재 버퍼/주소 범위를 virtual FS에 쓰기
 * f  : 현재 ed 파일명 확인/지정
 * e  : virtual FS 파일을 현재 버퍼로 열기
 *
 * 주소는 기존 parseRangeAt() / getRange()를 그대로 사용한다.
 * ============================================================ */


/*
 * 현재 버퍼가 수정되었는지 검사
 */
function edBufferModified() {

  const fname =
    edFileName ||
    currentFile;

  if (!fname)
    return false;

  if (
    !Object.prototype.hasOwnProperty.call(
      files,
      fname
    )
  )
    return true;

  return (
    editor.getValue() !==
    String(files[fname] ?? "")
  );

}


/*
 * ed 현재 파일명 설정
 */
function setEdFileName(fname) {

  fname =
    String(fname ?? "").trim();

  if (!fname)
    throw Error(
      "파일 이름이 없습니다."
    );

  edFileName =
    fname;

  currentFile =
    fname;

  refreshList();

}


/*
 * r filename
 *
 * 주소가 없으면 현재 줄 뒤.
 *
 * 0r file
 * .r file
 * 3r file
 * $r file
 * /abc/r file
 */
function readFileCommand(
  addr,
  filename
) {

  filename =
    String(filename ?? "").trim();


  if (
    !filename
  ) {

    throw Error(
      "r: 파일 이름이 없습니다."
    );

  }


  if (
    !Object.prototype.hasOwnProperty.call(
      files,
      filename
    )
  ) {

    throw Error(
      `파일이 없습니다: ${filename}`
    );

  }


  const content =
    String(
      files[filename] ?? ""
    );


  const items =
    content === ""
      ? []
      : splitText(content)
          .map(makeLine);


  const n =
    parseAddress(
      addr || "."
    );


  /*
   * 0r -> 맨 앞
   * .r -> 현재 줄 뒤
   * $r -> 마지막 줄 뒤
   */
  if (items.length) {

    buffer.splice(
      n,
      0,
      ...items
    );

    setCurrent(
      n + items.length
    );

  }
  else {

    /*
     * 빈 파일을 읽은 경우
     * 버퍼 내용은 바꾸지 않는다.
     */
    setCurrent(
      Math.min(
        n,
        buffer.length
      )
    );

  }


  /*
   * ed의 r은 파일명 자체를 바꾸지 않는다.
   */

  console.log(
    `${content.length}`
  );


  return current;

}


/*
 * w
 * w filename
 * 1,$w filename
 * 3,5w filename
 */
function writeFileCommand(
  addr,
  filename
) {

  filename =
    String(filename ?? "").trim();


  /*
   * 파일명이 없으면 현재 ed 파일명 사용
   */
  if (!filename) {

    filename =
      edFileName ||
      currentFile;

  }


  if (!filename) {

    throw Error(
      "w: 파일 이름이 없습니다."
    );

  }


  let s;
  let e;


  /*
   * 주소가 지정되면 그 범위만 기록
   */
  if (
    addr &&
    String(addr).trim()
  ) {

    const range =
      getRange(
        addr,
        "1,$"
      );

    s = range.s;
    e = range.e;

  }

  else {

    s = 1;
    e = buffer.length;

  }


  const text =
    buffer
      .slice(
        s - 1,
        e
      )
      .map(
        x => x.text
      )
      .join("\n");


  files[filename] =
    text;


  /*
   * w filename은 ed의 현재 파일명을 filename으로 갱신
   */
  edFileName =
    filename;

  currentFile =
    filename;


  refreshList();


  console.log(
    `${text.length}`
  );

  console.log(
    `"${filename}"에 저장됨`
  );


  return current;

}


/*
 * f
 * f filename
 */
function fileNameCommand(
  filename
) {

  filename =
    String(filename ?? "").trim();


  /*
   * f만 입력하면 현재 파일명 출력
   */
  if (!filename) {

    console.log(
      edFileName ||
      currentFile ||
      ""
    );

    return current;

  }


  /*
   * 따옴표 파일명 지원
   */
  if (
    (
      filename.startsWith('"') &&
      filename.endsWith('"')
    ) ||
    (
      filename.startsWith("'") &&
      filename.endsWith("'")
    )
  ) {

    filename =
      quoted(filename);

  }


  setEdFileName(
    filename
  );


  console.log(
    filename
  );


  return current;

}


/*
 * e filename
 * e! filename
 * e
 * e!
 */
function editFileCommand(
  command
) {

  let text =
    String(command ?? "").trim();


  let force =
    false;


  if (
    text === "!"
  ) {

    force = true;

    text = "";

  }

  else if (
    text.startsWith("!")
  ) {

    force = true;

    text =
      text
        .slice(1)
        .trim();

  }


  let filename =
    text;


  if (!filename) {

    filename =
      edFileName ||
      currentFile;

  }


  if (!filename) {

    throw Error(
      "e: 파일 이름이 없습니다."
    );

  }


  /*
   * 수정된 버퍼를 일반 e로 버리는 것을 방지
   */
  if (
    !force &&
    edBufferModified()
  ) {

    throw Error(
      `수정된 버퍼입니다. 강제 열기: e! ${filename}`
    );

  }


  /*
   * virtual FS에 존재하면 내용 로드.
   *
   * 존재하지 않으면 빈 파일로 새로 생성.
   */
  const exists =
    Object.prototype.hasOwnProperty.call(
      files,
      filename
    );


  let content;


  if (exists) {

    content =
      String(
        files[filename] ?? ""
      );

  }

  else {

    files[filename] =
      "";

    content =
      "";

  }


  const newLines =
    splitText(
      content
    );


  buffer =
    newLines.map(
      makeLine
    );


  if (
    !buffer.length
  ) {

    buffer = [
      makeLine("")
    ];

  }


  current =
    1;


  edFileName =
    filename;

  currentFile =
    filename;


  /*
   * Monaco에도 실제 버퍼를 반영
   */
  writeLines(
    buffer.map(
      x => x.text
    ),
    1
  );


  setEditorLanguage(
    filename
  );


  refreshList();


  console.log(
    `"${filename}" 편집 중`
  );


  return current;

}


/* ============================================================
 * execute
 *
 * 기존 dispatcher + r/w/f/e 추가
 * ============================================================ */

function execute(
  code,
  forcedAddr = null
) {

  ensureBuffer();


  code =
    String(code ?? "")
      .replace(
        /\r\n/g,
        "\n"
      )
      .trim();


  if (!code)
    return current;


  if (
    code === "help" ||
    code === "?"
  )
    return help();


  /* ----------------------------------------------------------
   * undo
   * ---------------------------------------------------------- */

  if (
    code === "u"
  ) {

    editor.trigger(
      "ed",
      "undo",
      null
    );

    buffer = null;

    return currentLine();

  }


  let parsed;


  try {

    parsed =
      splitAddressAndCommand(
        code
      );

  }

  catch {

    parsed = {
      addr: null,
      rest: code
    };

  }


  const addr =
    parsed.addr;


  const command =
    parsed.rest;


  const effectiveAddr =
    addr ||
    forcedAddr ||
    null;


  if (
    !addr &&
    (
      command.startsWith("g/") ||
      command.startsWith("g?") ||
      command.startsWith("v/") ||
      command.startsWith("v?")
    )
  ) {

    return globalCommand(
      forcedAddr || "1,$",
      command
    );

  }


  if (
    !addr &&
    command[0] === "s"
  ) {

    return substituteCommand(
      forcedAddr || ".",
      command
    );

  }


  if (!command) {

    return printCommand(
      effectiveAddr || ".",
      false,
      false
    );

  }


  if (
    command[0] === "g" ||
    command[0] === "v"
  ) {

    if (
      command[1] === "/" ||
      command[1] === "?"
    ) {

      return globalCommand(
        effectiveAddr || "1,$",
        command
      );

    }

  }


  if (
    command[0] === "s"
  ) {

    return substituteCommand(
      effectiveAddr || ".",
      command
    );

  }


  /* ==========================================================
   * r / w / f / e
   *
   * 주소가 splitAddressAndCommand()를 먼저 거쳤기 때문에
   * 다음과 같은 명령이 모두 가능하다.
   *
   * 3r abc.txt
   * 3,5w abc.txt
   * /foo/,$w abc.txt
   * f
   * f abc.txt
   * e abc.txt
   * e! abc.txt
   * ========================================================== */

  /*
   * f
   */
  if (
    command === "f" ||
    command.startsWith("f ")
  ) {

    return fileNameCommand(
      command
        .slice(1)
        .trim()
    );

  }


  /*
   * e / e!
   */
  if (
    command === "e" ||
    command === "e!" ||
    command.startsWith("e ") ||
    command.startsWith("e! ")
  ) {

    return editFileCommand(
      command
        .slice(1)
        .trim()
    );

  }


  /*
   * r
   */
  if (
    command === "r" ||
    command.startsWith("r ")
  ) {

    return readFileCommand(
      effectiveAddr || ".",
      command
        .slice(1)
        .trim()
    );

  }


  /*
   * w
   */
  if (
    command === "w" ||
    command.startsWith("w ")
  ) {

    return writeFileCommand(
      effectiveAddr,
      command
        .slice(1)
        .trim()
    );

  }


  const c =
    command[0];


  switch (c) {

    case "p": {

      const suffix =
        command
          .slice(1)
          .trim();


      if (suffix)
        throw Error(
          `알 수 없는 명령입니다: ${code}`
        );


      return printCommand(
        effectiveAddr || ".",
        false,
        false
      );

    }


    case "n": {

      const suffix =
        command
          .slice(1)
          .trim();


      if (suffix)
        throw Error(
          `알 수 없는 명령입니다: ${code}`
        );


      return printCommand(
        effectiveAddr || ".",
        true,
        false
      );

    }


    case "l": {

      const suffix =
        command
          .slice(1)
          .trim();


      if (suffix)
        throw Error(
          `알 수 없는 명령입니다: ${code}`
        );


      return printCommand(
        effectiveAddr || ".",
        false,
        true
      );

    }


    case "d": {

      if (
        command
          .slice(1)
          .trim()
      )
        throw Error(
          `알 수 없는 명령입니다: ${code}`
        );


      return deleteCommand(
        effectiveAddr || "."
      );

    }


    case "j": {

      if (
        command
          .slice(1)
          .trim()
      )
        throw Error(
          `알 수 없는 명령입니다: ${code}`
        );


      return joinCommand(
        effectiveAddr || null
      );

    }


    case "i": {

      const rest =
        command
          .slice(1)
          .trim();


      if (!rest)
        throw Error(
          "insert 내용이 없습니다."
        );


      return insertCommand(
        effectiveAddr || ".",
        quoted(rest)
      );

    }


    case "a": {

      const rest =
        command
          .slice(1)
          .trim();


      if (!rest)
        throw Error(
          "append 내용이 없습니다."
        );


      return appendCommand(
        effectiveAddr || ".",
        quoted(rest)
      );

    }


    case "c": {

      const rest =
        command
          .slice(1)
          .trim();


      if (!rest)
        throw Error(
          "change 내용이 없습니다."
        );


      return changeCommand(
        effectiveAddr || ".",
        quoted(rest)
      );

    }


    case "t": {

      const rest =
        command
          .slice(1)
          .trim();


      if (!rest)
        throw Error(
          "copy 대상 주소가 없습니다."
        );


      return copyCommand(
        effectiveAddr || ".",
        rest
      );

    }


    case "m": {

      const rest =
        command
          .slice(1)
          .trim();


      if (!rest)
        throw Error(
          "move 대상 주소가 없습니다."
        );


      return moveCommand(
        effectiveAddr || ".",
        rest
      );

    }


    case "=": {

      const r =
        effectiveAddr
          ? getRange(
              effectiveAddr,
              "."
            )
          : {
              s: buffer.length,
              e: buffer.length
            };


      console.log(r.e);

      return current;

    }


    default:

      throw Error(
        `알 수 없는 명령입니다: ${code}`
      );

  }

}


/* ============================================================
 * Top-level command splitter
 * ============================================================ */

function scanTopLevelSubstitute(
  text,
  start
) {

  return scanSubstituteCommand(
    text,
    start
  );

}


function scanTopLevelGlobal(
  text,
  start
) {

  const delimiter =
    text[start + 1];


  let p =
    start + 2;


  while (
    p < text.length
  ) {

    const c =
      text[p];


    if (
      c === "\\"
    ) {

      p += 2;

      continue;

    }


    if (
      c === delimiter
    ) {

      p++;

      break;

    }


    p++;

  }


  return text.length;

}


function splitTopLevelCommands(
  text
) {

  const result = [];

  let start = 0;
  let p = 0;


  while (
    p < text.length
  ) {

    const c =
      text[p];


    if (
      (
        c === "g" ||
        c === "v"
      ) &&
      p + 1 < text.length &&
      (
        text[p + 1] === "/" ||
        text[p + 1] === "?"
      ) &&
      (
        p === start ||
        /[\s,;]/.test(
          text[p - 1]
        )
      )
    ) {

      p =
        scanTopLevelGlobal(
          text,
          p
        );

      continue;

    }


    if (
      c === "s" &&
      p === start
    ) {

      p =
        scanTopLevelSubstitute(
          text,
          p
        );

      continue;

    }


    if (
      (
        c === "/" ||
        c === "?"
      ) &&
      (
        p === start ||
        /[\s,;]/.test(
          text[p - 1]
        )
      )
    ) {

      const delimiter =
        c;


      p++;


      while (
        p < text.length
      ) {

        if (
          text[p] === "\\"
        ) {

          p += 2;

          continue;

        }


        if (
          text[p] === delimiter
        ) {

          p++;

          break;

        }


        p++;

      }


      continue;

    }


    if (
      c === "\n"
    ) {

      const command =
        text
          .slice(
            start,
            p
          )
          .trim();


      if (command)
        result.push(command);


      p++;

      start = p;

      continue;

    }


    p++;

  }


  const last =
    text
      .slice(start)
      .trim();


  if (last)
    result.push(last);


  return result;

}


/* ============================================================
 * runCode
 * ============================================================ */

function runCode(code) {

  code =
    String(code ?? "");


  if (
    !code.trim()
  )
    return;


  syncBuffer();


  const commands =
    splitTopLevelCommands(
      code
    );


  let result =
    current;


  try {

    for (
      const command of commands
    ) {

      result =
        execute(command);

    }


    commit();


    return result;

  }

  catch (err) {

    log(
      "Error: " +
      err.message
    );

  }

}

/* ============================================================
 * ed 공개 API
 * ============================================================ */

window.ed = (
  strings,
  ...values
) => {

  if (
    typeof strings === "string"
  )
    return runCode(strings);


  return runCode(
    String.raw(
      strings,
      ...values
    )
  );

};


/* ============================================================
 * 외부 접근용
 * ============================================================ */

window.runCode =
  runCode;


/* ============================================================
 * Ctrl+Z / Ctrl+Shift+Z
 * ============================================================ */

window.addEventListener(
  "keydown",
  e => {

    if (!editor)
      return;


    if (
      e.ctrlKey &&
      !e.shiftKey &&
      e.key.toLowerCase() === "z"
    ) {

      return;

    }


    if (
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === "z"
    ) {

      e.preventDefault();

      editor.trigger(
        "keyboard",
        "redo",
        null
      );

    }


    if (
      e.ctrlKey &&
      !e.shiftKey &&
      e.key.toLowerCase() === "y"
    ) {

      e.preventDefault();

      editor.trigger(
        "keyboard",
        "redo",
        null
      );

    }

  }
);


/* ============================================================
 * F5 / Ctrl+R 방지
 * ============================================================ */

window.addEventListener(
  "beforeunload",
  function (e) {

    e.preventDefault();

    e.returnValue = "";

  }
);


/* ============================================================
 * ready
 * ============================================================ */

function waitForEditorReady() {

  if (!editor) {

    requestAnimationFrame(
      waitForEditorReady
    );

    return;

  }


  console.log(
    `%cMonaco ed ready — ${editor.getModel().getLineCount()} lines`,
    "color:#4caf50;font-weight:bold"
  );


  console.log(
    "ed\`help\` 또는 ed('help')"
  );


}


waitForEditorReady();

</script>

</body>
</html>
