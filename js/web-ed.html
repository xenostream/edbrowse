<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mini FS Editor - Monaco ed</title>
<style>
:root {
  --console-h: 150px;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Cascadia Code", monospace;
  background: #1e1e1e;
  color: #ddd;
}
#container {
  display: flex;
  height: 100vh;
  width: 100vw;
}
#sidebar {
  width: 250px;
  min-width: 0;
  background: #252526;
  border-right: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: width 0.2s ease;
  overflow: hidden;
}
#sidebar.collapsed {
  width: 0;
}
#sidebar-toggle {
  width: 12px;
  background: #333;
  border: none;
  color: #eee;
  cursor: pointer;
  padding: 0;
}
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
#editor {
  height: calc(100vh - var(--console-h));
  width: 100%;
  transition: height 0.2s ease;
}
#console-toggle {
  background: #333;
  border: none;
  color: #eee;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
}
#console {
  height: var(--console-h);
  background: #111;
  border-top: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: height 0.2s ease;
  overflow: hidden;
  position: relative;
}
#console-resizer {
  position: absolute;
  top: -3px;
  left: 0;
  right: 0;
  height: 6px;
  cursor: ns-resize;
  z-index: 100;
  background: transparent;
}
#console-resizer:hover {
  background: #555;
}
#console-resizer.dragging {
  background: #007acc;
}
#console-output {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 6px;
  color: #0f0;
  white-space: pre-wrap;
}
#console-output::-webkit-scrollbar {
  width: 10px;
}
#console-output::-webkit-scrollbar-track {
  background: #111;
}
#console-output::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 5px;
}
#console-output::-webkit-scrollbar-thumb:hover {
  background: #555;
}
#console-input {
  height: 60px;
}
#toolbar {
  display: flex;
  justify-content: space-around;
  padding: 6px;
  border-bottom: 1px solid #333;
}
#toolbar button {
  background: none;
  border: none;
  color: #eee;
  font-size: 18px;
  cursor: pointer;
}
#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  font-size: 13px;
}
.file-item {
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 3px;
  user-select: none;
}
.file-item:hover {
  background: #333;
}
.file-item.active {
  background: #444;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.56.0/min/vs/loader.min.js"></script>
</head>
<body>
<div id="container">
  <div id="sidebar">
    <div id="toolbar">
      <button id="btnNew" title="New">✨</button>
      <button id="btnDelete" title="Delete">🗑️</button>
      <button id="btnSave" title="Save (가상FS)">💾</button>
      <button id="btnOpen" title="Open">📂</button>
      <button id="btnDownload" title="Download">⬇️</button>
    </div>
    <div id="file-list" aria-label="Files"></div>
  </div>
  <button id="sidebar-toggle">◀</button>
  <div id="main">
    <div id="editor"></div>
    <button id="console-toggle">▼ Console</button>
    <div id="console">
      <div id="console-resizer"></div>
      <div id="console-output"></div>
      <div id="console-input"></div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" style="display:none">
<script>
require.config({
  paths: {
    vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.56.0/min/vs"
  }
});

let editor = null;
let jsConsole = null;
let currentFile = null;
const files = {};
let edFileName = null;
const editorFileSettings = {};
let currentEditorFont = "Cascadia Code";
let currentEditorLanguage = "plaintext";

function log(msg) {
  const out = document.getElementById("console-output");
  out.textContent += String(msg) + "\n";
  out.scrollTop = out.scrollHeight;
}

const origLog = console.log;
console.log = (...args) => {
  origLog(...args);
  log(args.map(x => String(x)).join(" "));
};

const fallbackSystemFonts = [
  "Cascadia Code",
  "Cascadia Mono",
  "Consolas",
  "Courier New",
  "Lucida Console",
  "Menlo",
  "Monaco",
  "SFMono-Regular",
  "Source Code Pro",
  "JetBrains Mono",
  "Fira Code",
  "Roboto Mono",
  "Ubuntu Mono",
  "DejaVu Sans Mono",
  "Liberation Mono",
  "Arial",
  "Helvetica",
  "Helvetica Neue",
  "Segoe UI",
  "Tahoma",
  "Verdana",
  "Noto Sans",
  "Noto Sans Mono",
  "Noto Sans KR",
  "Malgun Gothic",
  "맑은 고딕",
  "Apple SD Gothic Neo",
  "NanumGothic",
  "Nanum Gothic"
];

let localFontCache = null;
let localFontQueryPromise = null;

async function getAvailableFonts() {
  if (localFontCache)
    return localFontCache;
  if (localFontQueryPromise)
    return localFontQueryPromise;

  localFontQueryPromise = (async () => {
    const fonts = new Set(fallbackSystemFonts);
    try {
      if (typeof window.queryLocalFonts === "function") {
        const localFonts = await window.queryLocalFonts();
        for (const font of localFonts) {
          if (font && font.family)
            fonts.add(String(font.family));
          if (font && font.fullName)
            fonts.add(String(font.fullName));
        }
      }
    } catch (e) {}

    localFontCache = Array.from(fonts)
      .filter(Boolean)
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

    return localFontCache;
  })();

  return localFontQueryPromise;
}

function normalizeEditorName(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[\s_\-./\\]+/g, "");
}

function findMonacoLanguage(value) {
  if (!window.monaco)
    return null;

  const wanted = normalizeEditorName(value);
  if (!wanted)
    return null;

  const languages = monaco.languages.getLanguages();

  const aliases = {
    "markdown": "markdown",
    "md": "markdown",
    "markdowndocument": "markdown",
    "javascript": "javascript",
    "js": "javascript",
    "ecmascript": "javascript",
    "typescript": "typescript",
    "ts": "typescript",
    "json": "json",
    "html": "html",
    "htm": "html",
    "css": "css",
    "scss": "scss",
    "sass": "scss",
    "less": "less",
    "xml": "xml",
    "xhtml": "xml",
    "plaintext": "plaintext",
    "text": "plaintext",
    "txt": "plaintext",
    "csharp": "csharp",
    "cs": "csharp",
    "csharpcode": "csharp",
    "cpp": "cpp",
    "cplusplus": "cpp",
    "cxx": "cpp",
    "c": "c",
    "java": "java",
    "python": "python",
    "py": "python",
    "ruby": "ruby",
    "rb": "ruby",
    "php": "php",
    "go": "go",
    "golang": "go",
    "rust": "rust",
    "rs": "rust",
    "sql": "sql",
    "shell": "shell",
    "bash": "shell",
    "sh": "shell",
    "powershell": "powershell",
    "ps": "powershell",
    "yaml": "yaml",
    "yml": "yaml",
    "dockerfile": "dockerfile",
    "graphql": "graphql",
    "ini": "ini",
    "bat": "bat",
    "batch": "bat",
    "coffeescript": "coffeescript",
    "coffee": "coffeescript"
  };

  if (aliases[wanted]) {
    const direct = languages.find(lang => lang.id === aliases[wanted]);
    if (direct)
      return direct;
  }

  for (const lang of languages) {
    const candidates = [
      lang.id,
      ...(Array.isArray(lang.aliases) ? lang.aliases : []),
      ...(Array.isArray(lang.extensions) ? lang.extensions : []),
      ...(Array.isArray(lang.mimetypes) ? lang.mimetypes : [])
    ];

    for (const candidate of candidates) {
      let normalized = normalizeEditorName(candidate);
      if (normalized.startsWith("dot"))
        normalized = normalized.slice(3);
      if (normalized === wanted)
        return lang;
    }
  }

  return null;
}

function getLanguageDisplayName(language) {
  if (!language)
    return "";
  if (Array.isArray(language.aliases) && language.aliases.length)
    return language.aliases[0];
  return language.id;
}

function getCurrentFileSettings() {
  const fname = edFileName || currentFile;
  if (!fname)
    return null;

  if (!editorFileSettings[fname])
    editorFileSettings[fname] = {};

  return editorFileSettings[fname];
}

function setEditorFont(fontName, remember = true) {
  if (!editor)
    return;

  fontName = String(fontName ?? "").trim();

  if (!fontName)
    throw Error("font 이름이 없습니다.");

  editor.updateOptions({
    fontFamily: fontName
  });

  currentEditorFont = fontName;

  if (remember) {
    const settings = getCurrentFileSettings();
    if (settings)
      settings.font = fontName;
  }
}

function setEditorSyntax(syntaxName, remember = true) {
  if (!editor)
    return;

  const language = findMonacoLanguage(syntaxName);

  if (!language)
    throw Error(`지원하지 않는 syntax입니다: ${syntaxName}`);

  monaco.editor.setModelLanguage(editor.getModel(), language.id);
  currentEditorLanguage = language.id;

  if (remember) {
    const settings = getCurrentFileSettings();
    if (settings)
      settings.syntax = language.id;
  }

  return language.id;
}

function applyCurrentFileEditorSettings() {
  if (!editor)
    return;

  const settings = getCurrentFileSettings();

  if (settings && settings.font)
    setEditorFont(settings.font, false);
  else
    setEditorFont("Cascadia Code", false);

  if (settings && settings.syntax) {
    const language = findMonacoLanguage(settings.syntax);
    if (language) {
      monaco.editor.setModelLanguage(editor.getModel(), language.id);
      currentEditorLanguage = language.id;
    }
  }
}

function readEditorSettingValue(text, start) {
  let p = start;

  while (p < text.length && /\s/.test(text[p]))
    p++;

  if (p >= text.length)
    throw Error("설정 값이 없습니다.");

  const quote = text[p];

  if (quote === '"' || quote === "'") {
    p++;
    let value = "";

    while (p < text.length) {
      const c = text[p++];

      if (c === "\\") {
        if (p >= text.length)
          break;

        const next = text[p++];

        if (next === "n")
          value += "\n";
        else if (next === "r")
          value += "\r";
        else if (next === "t")
          value += "\t";
        else
          value += next;

        continue;
      }

      if (c === quote)
        return { value, end: p };

      value += c;
    }

    throw Error("설정 문자열의 따옴표가 닫히지 않았습니다.");
  }

  let value = "";

  while (p < text.length && text[p] !== ",")
    value += text[p++];

  value = value.trim();

  if (!value)
    throw Error("설정 값이 없습니다.");

  return { value, end: p };
}

function splitEditorSettingParts(text) {
  const parts = [];
  let start = 0;
  let quote = null;
  let escaped = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (escaped) {
      escaped = false;
      continue;
    }

    if (c === "\\") {
      escaped = true;
      continue;
    }

    if (quote) {
      if (c === quote)
        quote = null;
      continue;
    }

    if (c === '"' || c === "'") {
      quote = c;
      continue;
    }

    if (c === ",") {
      parts.push(text.slice(start, i).trim());
      start = i + 1;
    }
  }

  const last = text.slice(start).trim();
  if (last)
    parts.push(last);

  return parts;
}

function runEditorSettingCommand(code) {
  const text = String(code ?? "").trim();

  if (!/^(font|syntax)\s*=/i.test(text))
    return false;

  const parts = splitEditorSettingParts(text);

  if (!parts.length)
    return false;

  const settings = [];

  for (const part of parts) {
    const match = part.match(/^(font|syntax)\s*=/i);

    if (!match)
      throw Error(`잘못된 editor 설정: ${part}`);

    const key = match[1].toLowerCase();
    const valueInfo = readEditorSettingValue(part, match[0].length);

    if (part.slice(valueInfo.end).trim())
      throw Error(`잘못된 editor 설정: ${part}`);

    settings.push({
      key,
      value: valueInfo.value
    });
  }

  let syntaxLanguage = null;

  for (const setting of settings) {
    if (setting.key === "font" && !setting.value.trim())
      throw Error("font 이름이 없습니다.");

    if (setting.key === "syntax") {
      syntaxLanguage = findMonacoLanguage(setting.value);

      if (!syntaxLanguage)
        throw Error(`지원하지 않는 syntax입니다: ${setting.value}`);
    }
  }

  for (const setting of settings) {
    if (setting.key === "font") {
      setEditorFont(setting.value);
      log(`폰트 변경: ${setting.value}`);
    } else if (setting.key === "syntax") {
      setEditorSyntax(setting.value);
      log(`문법 강조 변경: ${getLanguageDisplayName(syntaxLanguage)} (${syntaxLanguage.id})`);
    }
  }

  return true;
}

function registerEditorSettingCompletionProvider() {
  if (!window.monaco || !monaco.languages)
    return;

  monaco.languages.registerCompletionItemProvider("javascript", {
    triggerCharacters: ["=", '"', "'", " "],
    provideCompletionItems: async (model, position) => {
      const line = model.getLineContent(position.lineNumber);
      const before = line.slice(0, position.column - 1);

      const settingMatch = before.match(
        /(?:^|[,\s])(font|syntax)\s*=\s*(?:"[^"]*|[^,\s]*)$/i
      );

      if (!settingMatch)
        return { suggestions: [] };

      const type = settingMatch[1].toLowerCase();

      const lastQuote = Math.max(
        before.lastIndexOf('"'),
        before.lastIndexOf("'")
      );

      let typed = "";

      if (lastQuote >= 0) {
        typed = before.slice(lastQuote + 1);
      } else {
        const valueMatch = before.match(
          /(?:font|syntax)\s*=\s*([^\s,]*)$/i
        );
        typed = valueMatch ? valueMatch[1] : "";
      }

      const normalizedTyped = normalizeEditorName(typed);
      const suggestions = [];

      if (type === "font") {
        const fonts = await getAvailableFonts();

        for (const font of fonts) {
          if (
            normalizedTyped &&
            !normalizeEditorName(font).includes(normalizedTyped)
          )
            continue;

          suggestions.push({
            label: font,
            kind: monaco.languages.CompletionItemKind.Value,
            insertText: font,
            detail: "System Font",
            documentation: `font="${font}"`,
            range: getCompletionReplaceRange(model, position, typed)
          });
        }
      } else {
        const languages = monaco.languages.getLanguages();
        const seen = new Set();

        for (const language of languages) {
          const names = [
            language.id,
            ...(Array.isArray(language.aliases) ? language.aliases : [])
          ];

          for (const name of names) {
            if (!name)
              continue;

            const normalizedName = normalizeEditorName(name);

            if (
              normalizedTyped &&
              !normalizedName.includes(normalizedTyped)
            )
              continue;

            const key = language.id + "::" + normalizedName;

            if (seen.has(key))
              continue;

            seen.add(key);

            suggestions.push({
              label: name,
              kind: monaco.languages.CompletionItemKind.Keyword,
              insertText: name,
              detail: `syntax → ${language.id}`,
              documentation: `syntax="${name}"`,
              range: getCompletionReplaceRange(model, position, typed)
            });
          }
        }
      }

      return { suggestions };
    }
  });
}

function getCompletionReplaceRange(model, position, typed) {
  const startColumn = Math.max(
    1,
    position.column - typed.length
  );

  return {
    startLineNumber: position.lineNumber,
    startColumn,
    endLineNumber: position.lineNumber,
    endColumn: position.column
  };
}

require(["vs/editor/editor.main"], function() {
  editor = monaco.editor.create(
    document.getElementById("editor"),
    {
      value: "",
      language: "plaintext",
      theme: "vs-dark",
      fontSize: 14,
      fontFamily: "Cascadia Code",
      wordWrap: "on",
      folding: true,
      minimap: {
        enabled: true
      },
      automaticLayout: false
    }
  );

  currentEditorFont = "Cascadia Code";
  currentEditorLanguage = "plaintext";

  jsConsole = monaco.editor.create(
    document.getElementById("console-input"),
    {
      value: "// ed 명령 예) 1,$p   g/the/t.   s/foo/bar/g",
      language: "javascript",
      theme: "vs-dark",
      fontSize: 13,
      minimap: {
        enabled: false
      },
      lineNumbers: "off",
      automaticLayout: false
    }
  );

  registerEditorSettingCompletionProvider();

  jsConsole.onKeyDown(e => {
    if (e.keyCode !== monaco.KeyCode.Enter)
      return;
    if (e.shiftKey)
      return;

    const code = jsConsole.getValue();

    if (/\\$/.test(code))
      return;

    const trimmed = code.trim();
    jsConsole.setValue("");

    if (trimmed)
      runCode(trimmed);

    e.preventDefault();
  });

  const ro = new ResizeObserver(() => {
    if (editor)
      editor.layout();
    if (jsConsole)
      jsConsole.layout();
  });

  ro.observe(document.getElementById("main"));
  ro.observe(document.getElementById("editor"));
  ro.observe(document.getElementById("console"));

  window.addEventListener("resize", () => {
    if (editor)
      editor.layout();
    if (jsConsole)
      jsConsole.layout();
  });

  refreshList();
});

function refreshList() {
  const list = document.getElementById("file-list");

  // 기존 파일 목록을 완전히 비움
  list.innerHTML = "";

  const names = Object.keys(files);

  if (!names.length) {
    list.innerHTML =
      "<div style='color:#888;padding:6px'>" +
      "파일이 없습니다. ✨ 또는 📂 버튼을 사용하세요." +
      "</div>";
    return;
  }

  names.forEach(fname => {
    const div = document.createElement("div");

    div.className =
      "file-item" +
      (fname === currentFile ? " active" : "");

    div.textContent = fname;

    div.onclick = () => openFile(fname);

    list.appendChild(div);
  });
}

function detectLanguage(fname) {
  const ext = fname.split(".").pop().toLowerCase();

  if (ext === "js")
    return "javascript";
  if (ext === "ts")
    return "typescript";
  if (ext === "md")
    return "markdown";
  if (ext === "cs")
    return "csharp";
  if (ext === "html" || ext === "htm")
    return "html";
  if (ext === "css")
    return "css";
  if (ext === "json")
    return "json";
  if (ext === "xml")
    return "xml";

  return "plaintext";
}

function setEditorLanguage(fname) {
  if (!editor)
    return;

  const detected = detectLanguage(fname);

  monaco.editor.setModelLanguage(
    editor.getModel(),
    detected
  );

  currentEditorLanguage = detected;

  const settings = getCurrentFileSettings();

  if (settings && settings.syntax) {
    const language = findMonacoLanguage(settings.syntax);

    if (language) {
      monaco.editor.setModelLanguage(
        editor.getModel(),
        language.id
      );
      currentEditorLanguage = language.id;
    }
  }
}

document.getElementById("btnNew").addEventListener("click", () => {
  const fname = prompt("새 파일 이름:", "untitled.txt");

  if (!fname || files[fname]) {
    alert("파일 존재");
    return;
  }

  files[fname] = "";
  currentFile = fname;
  edFileName = fname;
  editor.setValue("");
  setEditorLanguage(fname);
  applyCurrentFileEditorSettings();
  refreshList();
  log(`생성됨: ${fname}`);
});

function openFile(fname) {
  currentFile = fname;
  edFileName = fname;

  const content = files[fname] ?? "";

  editor.setValue(content);
  setEditorLanguage(fname);
  applyCurrentFileEditorSettings();
  refreshList();
  log(`열림: ${fname}`);
}

document.getElementById("btnDelete").addEventListener("click", () => {
  if (!currentFile) {
    alert("열린 파일 없음");
    return;
  }

  delete files[currentFile];
  delete editorFileSettings[currentFile];

  currentFile = null;
  edFileName = null;

  editor.setValue("");

  monaco.editor.setModelLanguage(
    editor.getModel(),
    "plaintext"
  );

  currentEditorLanguage = "plaintext";

  refreshList();
  log("삭제됨 (가상 FS)");
});

document.getElementById("btnSave").addEventListener("click", () => {
  if (!currentFile) {
    alert("열린 파일 없음");
    return;
  }

  files[currentFile] = editor.getValue();
  edFileName = currentFile;
  log("저장됨: " + currentFile);
});

document.getElementById("btnOpen").addEventListener("click", () => {
  const input = document.getElementById("fileInput");
  input.value = "";
  input.click();
});

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];

  if (!file)
    return;

  const reader = new FileReader();

  reader.onload = () => {
    files[file.name] = reader.result;
    currentFile = file.name;
    edFileName = file.name;

    editor.setValue(reader.result);
    setEditorLanguage(file.name);
    applyCurrentFileEditorSettings();
    refreshList();

    log(`로컬 파일 로드: ${file.name}`);
  };

  reader.readAsText(file, "UTF-8");
});

document.getElementById("btnDownload").addEventListener("click", () => {
  if (!currentFile) {
    alert("열린 파일 없음");
    return;
  }

  const text = editor.getValue();

  const blob = new Blob(
    [text],
    {
      type: "text/plain;charset=utf-8"
    }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = currentFile || "untitled.txt";
  a.click();

  URL.revokeObjectURL(url);

  log(`다운로드 완료: ${a.download}`);
});

const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebar-toggle");

sidebarToggle.addEventListener("click", () => {
  sidebar.classList.toggle("collapsed");

  sidebarToggle.textContent =
    sidebar.classList.contains("collapsed")
      ? "▶"
      : "◀";

  requestAnimationFrame(() => {
    if (editor)
      editor.layout();
    if (jsConsole)
      jsConsole.layout();

    requestAnimationFrame(() => {

  if (!Array.isArray(lines) || !lines.length)
    lines = [""];

  const normalized = lines.map(x => String(x ?? ""));
  const text = normalized.join("\n");
  const model = editor.getModel();

  const newLineCount =
    Math.max(1, normalized.length);

  const targetLine = Math.max(
    1,
    Math.min(
      Number(cursor) || 1,
      newLineCount
    )
  );

  let anchor = 0;

  for (let i = 0; i < targetLine - 1; i++)
    anchor += normalized[i].length + 1;

  anchor = Math.max(
    0,
    Math.min(anchor, text.length)
  );

  editor.pushUndoStop();

  editor.executeEdits(
    "ed",
    [
      {
        range: model.getFullModelRange(),
        text,
        forceMoveMarkers: true
      }
    ]
  );

  const newModel = editor.getModel();

  const line = Math.max(
    1,
    Math.min(
      targetLine,
      newModel.getLineCount()
    )
  );

  const column = Math.min(
    1,
    newModel.getLineMaxColumn(line)
  );

  editor.setPosition({
    lineNumber: line,
    column
  });

  editor.revealLineInCenter(line);
  editor.pushUndoStop();
}

function parseAddressAt(s, pos = 0, base = current) {

      value: base,
      end: pos,
      present: false

    n = 0;
    pos++;

    const r = readDelimited(s, pos + 1, delimiter);

      r.value,
      base,
      delimiter === "/" ? 1 : -1
    );

    n = base;

    return {
      value: base,
      end: pos,
      present: false

    while (pos < s.length && /\s/.test(s[pos]))

    const m = s.slice(pos).match(/^\d+/);

    value: n,
    end: pos,

function parseRangeAt(s, pos = 0, defaultAddr = ".") {
  ensureBuffer();

    const first = separator === "," ? 1 : current;
    const second = buffer.length;

    return {
      s: first,
      e: second,
      end: pos,
      present: true
    };
  }

  if (pos >= s.length) {
    const n = parseAddress(defaultAddr);

    return {
      s: n,
      e: n,
      end: pos,
      present: false
    };
  }

  const first = parseAddressAt(s, pos, current);

  if (!first.present) {
    const n = parseAddress(defaultAddr);

    return {
      s: n,
      e: n,
      end: startPos,
      present: false
    };
  }

  pos = first.end;

  while (pos < s.length && /\s/.test(s[pos]))
    pos++;

  if (s[pos] !== "," && s[pos] !== ";") {
    return {
      s: first.value,
      e: first.value,
      end: pos,
      present: true
    };
  }

  const separator = s[pos++];

  const second = parseAddressAt(
    s,
    pos,
    separator === ";" ? first.value : current
  );

  if (!second.present)
    throw Error("두 번째 주소가 없습니다.");

  pos = second.end;

  if (separator === ";")
    setCurrent(first.value);

  if (first.value > second.value)
    throw Error("잘못된 줄 범위입니다.");

  return {
    s: first.value,
    e: second.value,
    end: pos,
    present: true
  };

function parseAddress(s, base = current) {
  ensureBuffer();

  const text = String(s ?? "");
  const r = parseAddressAt(text, 0, base);

  if (!r.present)
    throw Error(`잘못된 주소: ${s}`);

  if (text.slice(r.end).trim())
    throw Error(`잘못된 주소: ${s}`);

  return r.value;
}

function getRange(s, defaultAddr = ".") {
  ensureBuffer();

  const text = String(s ?? "");

  if (text.trim() === ",")
    return { s: 1, e: buffer.length };

  if (text.trim() === ";")
    return { s: current, e: buffer.length };

  const r = parseRangeAt(text, 0, defaultAddr);

  if (text.slice(r.end).trim())
    throw Error(`잘못된 주소: ${s}`);

  return {
    s: r.s,
    e: r.e
  };
}

function printCommand(addr, numbered = false, list = false) {
  const { s, e } = getRange(addr, ".");

  for (let n = s; n <= e; n++) {

    if (list) {
      text = text
        .replace(/\\/g, "\\\\")
        .replace(/\t/g, "\\t")
        .replace(/\r/g, "\\r")
        .replace(/[\x00-\x1f\x7f-\x9f]/g, c => {

}

function deleteCommand(addr) {
  const { s, e } = getRange(addr, ".");

  buffer.splice(s - 1, e - s + 1);

  if (!buffer.length) {
    buffer.push(makeLine(""));
    setCurrent(1);
    return 1;
  }

  setCurrent(Math.min(s, buffer.length));
  return current;
}

function splitText(text) {

    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .split("\n");

  const n = parseAddress(addr || ".");
  const items = splitText(text).map(makeLine);

  buffer.splice(n - 1, 0, ...items);

  setCurrent(n + items.length - 1);
  return current;
}

function appendCommand(addr, text) {
  const n = parseAddress(addr || ".");
  const items = splitText(text).map(makeLine);

  buffer.splice(n, 0, ...items);

  setCurrent(n + items.length);
  return current;
}

function changeCommand(addr, text) {
  const { s, e } = getRange(addr, ".");
  const items = splitText(text).map(makeLine);

  buffer.splice(
    s - 1,
    e - s + 1,
    ...items
  );

  if (items.length) {
    setCurrent(s + items.length - 1);
  } else {
    setCurrent(Math.min(s, buffer.length));
  }

  return current;

function joinCommand(addr) {
  ensureBuffer();

  let s;
  let e;

  if (addr == null || String(addr).trim() === "") {
    s = current;
    e = current + 1;
  } else {
    const range = getRange(addr, ".");
    s = range.s;
    e = range.e;

    if (s === e)
      e = s + 1;
  }

  if (s < 1 || s > buffer.length)
    throw Error(`잘못된 줄 주소: ${s}`);

  if (e > buffer.length)
    e = buffer.length;

  if (s === e) {
    setCurrent(s);
    return s;
  }

  const text = buffer
    .slice(s - 1, e)
    .map(x => x.text)
    .join("");

  const joined = makeLine(text);

  buffer.splice(
    s - 1,
    e - s + 1,
    joined
  );

  setCurrent(s);
  return s;
}

function copyCommand(addr, dest) {
  const { s, e } = getRange(addr, ".");
  const target = parseAddress(dest, current);

  if (target === 0) {
    const copies = buffer
      .slice(s - 1, e)
      .map(x => makeLine(x.text));

    buffer.splice(0, 0, ...copies);
    setCurrent(copies.length);
    return current;
  }

  if (
    target >= s &&
    target <= e &&
    !(s === e && target === s)
  )
    throw Error("복사 대상이 원본 범위 안에 있습니다.");

  const copies = buffer
    .slice(s - 1, e)
    .map(x => makeLine(x.text));

  buffer.splice(target, 0, ...copies);
  setCurrent(target + copies.length);

  return current;

function moveCommand(addr, dest) {
  const { s, e } = getRange(addr, ".");

  if (target >= s && target <= e)
    throw Error("이동 대상이 원본 범위 안에 있습니다.");

  const count = e - s + 1;

  const moved = buffer.splice(
    s - 1,
    count
  );

  let insertAt;

  if (target < s)
    insertAt = target;
  else
    insertAt = target - count;

  buffer.splice(insertAt, 0, ...moved);

  setCurrent(insertAt + count);
  return current;

const ESC = "\uFFFF";

function parseSubstitute(s) {
  if (s[0] !== "s")
    throw Error("잘못된 substitute 명령입니다.");

  const delimiter = s[1];

  if (!delimiter)
    throw Error("s 구분자가 없습니다.");

  let p = 2;
  const parts = [];

  for (let field = 0; field < 2; field++) {
    let value = "";
    let closed = false;

    while (p < s.length) {
      const c = s[p];

      if (c === "\\") {
        if (p + 1 >= s.length)
          throw Error("substitute escape가 닫히지 않았습니다.");

        const n = s[p + 1];

        if (n === "\n") {
          value += ESC + "\n";
          p += 2;
          continue;
        }

        if (n === "\r" && s[p + 2] === "\n") {
          value += ESC + "\n";
          p += 3;
          continue;
        }

        value += ESC + n;
        p += 2;
        continue;
      }

      if (c === delimiter) {
        p++;
        closed = true;
        break;
      }

      value += c;
      p++;
    }

    if (!closed)
      throw Error("substitute 구분자가 닫히지 않았습니다.");

    parts.push(value);
  }

  let flags = "";

  while (
    p < s.length &&
    /[0-9gGpPlnIi]/.test(s[p])
  ) {
    const f = s[p++];

    if (flags.includes(f))
      throw Error(`중복 substitute flag: ${f}`);

    flags += f;
  }

  if (s.slice(p).trim())
    throw Error(`잘못된 substitute suffix: ${s.slice(p)}`);

  return {
    delimiter,
    pattern: parts[0],
    replacement: parts[1],
    flags
  };
}

function decodeSubPattern(s, delimiter) {
  let out = "";

  for (let i = 0; i < s.length; i++) {
    const c = s[i];

    if (c !== ESC) {
      out += c;
      continue;
    }

    const n = s[++i];

    if (n === delimiter)
      out += delimiter;
    else if (n === "\n")
      out += "\n";
    else
      out += "\\" + n;
  }

  return out;
}

function decodeSubReplacement(s, delimiter) {
  let out = "";

  for (let i = 0; i < s.length; i++) {
    const c = s[i];

    if (c !== ESC) {
      out += c;
      continue;
    }

    const n = s[++i];

    if (n === "\n") {
      out += "\n";
      continue;
    }

    if (n === delimiter) {
      out += delimiter;
      continue;
    }

    if (/[1-9]/.test(n)) {
      out += "$" + n;
      continue;
    }

    if (n === "&") {
      out += "$&";
      continue;
    }

    out += n;
  }

  return out;
}

function jsReplacementToText(old, regex, replacement) {
  return old.replace(regex, replacement);
}

function substituteCommand(addr, command) {
  const sub = parseSubstitute(command);

  let pattern = decodeSubPattern(
    sub.pattern,
    sub.delimiter
  );

  if (!pattern)
    pattern = lastRegex;

  if (!pattern)
    throw Error("이전 정규식이 없습니다.");

  lastRegex = pattern;

  const replacement = decodeSubReplacement(
    sub.replacement,
    sub.delimiter
  );

  const flags = sub.flags;
  const globalFlag = flags.includes("g");
  const ignoreCase =
    flags.includes("I") ||
    flags.includes("i");

  const regexFlags =
    (globalFlag ? "g" : "") +
    (ignoreCase ? "i" : "");

  try {
    re = new RegExp(
      pattern,
      regexFlags

    throw Error(`잘못된 정규식: ${e.message}`);
  }

  const range = getRange(addr, ".");
  const start = range.s;
  const originalEnd = range.e;

  let n = start;
  let changed = false;
  let lastChanged = current;

  while (
    n <= originalEnd &&
    n <= buffer.length
  ) {
    const item = buffer[n - 1];

    re.lastIndex = 0;

    const old = item.text;

    const neu = jsReplacementToText(
      old,
      re,
      replacement
    );

    if (old === neu) {
      n++;
      continue;
    }

    changed = true;

    const newTexts = splitText(neu);
    const newItems = newTexts.map(makeLine);

    buffer.splice(
      n - 1,
      1,
      ...newItems
    );

    lastChanged =
      n + newItems.length - 1;

    n = lastChanged + 1;
  }

  if (!changed)
    throw Error("치환 없음");

  setCurrent(lastChanged);

  lastSubstitution = {
    pattern,
    replacement,
    global: globalFlag
  };

  if (flags.includes("p"))
    printCommand(String(current), false, false);

  if (flags.includes("n"))
    printCommand(String(current), true, false);

  if (flags.includes("l"))
    printCommand(String(current), false, true);

function parseGlobalHeader(code) {

    p > code.length ||
    code[p - 1] !== delimiter

    throw Error("global 정규식이 닫히지 않았습니다.");

    type,
    delimiter,
    pattern,
    restStart: p

    while (p < text.length) {

    p < text.length &&
    /[0-9gGpPlnIi]/.test(text[p])

        (
          text[p + 1] === "\r" &&
          text[p + 2] === "\n"
        )
      )
    ) {
      const command = text.slice(start, p).trim();

      if (command)
        result.push(command);

      if (text[p + 1] === "\r")
        p += 3;
      else
        p += 2;

      start = p;
      continue;
    }

    if (c === "\n") {
      const command = text.slice(start, p).trim();

      if (command)
        result.push(command);

      p++;
      start = p;
      continue;
    }

    p++;
  }

  const last = text.slice(start).trim();

  if (last)
    result.push(last);

  return result;
}

function globalCommand(addr, code) {
  const g = parseGlobalHeader(code);

  let pattern = decodeSubPattern(
    g.pattern,
    g.delimiter
  );

  if (!pattern)
    pattern = lastRegex;

  if (!pattern)
    throw Error("이전 정규식이 없습니다.");

  lastRegex = pattern;

  let re;

  try {
    re = new RegExp(pattern);
  } catch (e) {
    throw Error(`잘못된 global 정규식: ${e.message}`);
  }

  const { s, e } = getRange(
    addr,
    "1,$"
  );

  const markedIds = [];

  for (let n = s; n <= e; n++) {
    re.lastIndex = 0;

    const matched =
      re.test(buffer[n - 1].text);

    const select =
      g.type === "g"
        ? matched
        : !matched;

    if (select)
      markedIds.push(
        buffer[n - 1].id
      );
  }

  let commandText =
    code.slice(g.restStart);

  if (!commandText.trim())
    commandText = "p";

  const commands =
    splitGlobalCommands(commandText);

  if (!commands.length)
    commands.push("p");

  let lastResult = current;

  for (const id of markedIds) {
    const index = lineIndexById(id);

    if (index < 0)
      continue;

    setCurrent(index + 1);

    for (const command of commands) {
      if (!command)
        continue;

      const trimmed = command.trim();

      if (/^[gv][/?]/.test(trimmed))
        throw Error(
          "global 안에서 global/vglobal은 사용할 수 없습니다."
        );

      lastResult = execute(
        trimmed,
        String(current)
      );
    }
  }

  return lastResult;
}

function splitAddressAndCommand(code) {
  const r = parseRangeAt(
    code,
    0,
    "."
  );

  if (!r.present) {
    return {
      addr: null,
      rest: code.trim()
    };
  }

  return {
    addr: code.slice(0, r.end).trim(),
    rest: code.slice(r.end).trimStart()
  };
}

function edBufferModified() {
  const fname = edFileName || currentFile;

  if (!fname)
    return false;

  if (
    !Object.prototype.hasOwnProperty.call(
      files,
      fname
    )
  )
    return true;

  return (
    editor.getValue() !==
    String(files[fname] ?? "")
  );
}

function setEdFileName(fname) {
  fname = String(fname ?? "").trim();

  if (!fname)
    throw Error("파일 이름이 없습니다.");

  edFileName = fname;
  currentFile = fname;
  refreshList();
}

function readFileCommand(addr, filename) {
  filename = String(filename ?? "").trim();

  if (!filename)
    throw Error("r: 파일 이름이 없습니다.");

  if (
    !Object.prototype.hasOwnProperty.call(
      files,
      filename
    )
  )
    throw Error(`파일이 없습니다: ${filename}`);

  const content =
    String(files[filename] ?? "");

  const items =
    content === ""
      ? []
      : splitText(content).map(makeLine);

  const n = parseAddress(addr || ".");

  if (items.length) {
    buffer.splice(n, 0, ...items);
    setCurrent(n + items.length);
  } else {
    setCurrent(
      Math.min(n, buffer.length)
    );
  }

  console.log(`${content.length}`);

  return current;
}

function writeFileCommand(addr, filename) {
  filename = String(filename ?? "").trim();

  if (!filename)
    filename = edFileName || currentFile;

  if (!filename)
    throw Error("w: 파일 이름이 없습니다.");

  let s;
  let e;

  if (addr && String(addr).trim()) {
    const range = getRange(addr, "1,$");
    s = range.s;
    e = range.e;
  } else {
    s = 1;
    e = buffer.length;
  }

  const text = buffer
    .slice(s - 1, e)
    .map(x => x.text)
    .join("\n");

  files[filename] = text;
  edFileName = filename;
  currentFile = filename;

  refreshList();

  console.log(`${text.length}`);
  console.log(`"${filename}"에 저장됨`);

  return current;
}

function fileNameCommand(filename) {
  filename = String(filename ?? "").trim();

  if (!filename) {
    console.log(
      edFileName ||
      currentFile ||
      ""
    );
    return current;
  }

  if (
    (
      filename.startsWith('"') &&
      filename.endsWith('"')
    ) ||
    (
      filename.startsWith("'") &&
      filename.endsWith("'")
    )
  )
    filename = quoted(filename);

  setEdFileName(filename);
  console.log(filename);

  return current;
}

function editFileCommand(command) {
  let text = String(command ?? "").trim();
  let force = false;

  if (text === "!") {
    force = true;
    text = "";
  } else if (text.startsWith("!")) {
    force = true;
    text = text.slice(1).trim();
  }

  let filename = text;

  if (!filename)
    filename = edFileName || currentFile;

  if (!filename)
    throw Error("e: 파일 이름이 없습니다.");

  if (!force && edBufferModified())
    throw Error(
      `수정된 버퍼입니다. 강제 열기: e! ${filename}`
    );

  const exists =
    Object.prototype.hasOwnProperty.call(
      files,
      filename
    );

  let content;

  if (exists) {
    content = String(files[filename] ?? "");
  } else {
    files[filename] = "";
    content = "";
  }

  const newLines = splitText(content);

  buffer = newLines.map(makeLine);

  if (!buffer.length)
    buffer = [makeLine("")];

  current = 1;
  edFileName = filename;
  currentFile = filename;

  writeLines(
    buffer.map(x => x.text),
    1
  );

  setEditorLanguage(filename);
  applyCurrentFileEditorSettings();
  refreshList();

  console.log(`"${filename}" 편집 중`);

  return current;
}

function execute(code, forcedAddr = null) {
  ensureBuffer();

  code = String(code ?? "")
    .replace(/\r\n/g, "\n")
    .trim();

  if (!code)
    return current;

  if (/^(font|syntax)\s*=/i.test(code)) {
    runEditorSettingCommand(code);
    return current;
  }

  if (code === "help" || code === "?")
    return help();

  if (code === "u") {
    editor.getModel().undo();
    buffer = null;
    return currentLine();
  }

  let parsed;

  try {
    parsed = splitAddressAndCommand(code);
  } catch {
    parsed = {
      addr: null,
      rest: code
    };
  }

  const addr = parsed.addr;
  const command = parsed.rest;
  const effectiveAddr =
    addr ||
    forcedAddr ||
    null;

  if (
    !addr &&
    (
      command.startsWith("g/") ||
      command.startsWith("g?") ||
      command.startsWith("v/") ||
      command.startsWith("v?")
    )
  )
    return globalCommand(
      forcedAddr || "1,$",
      command
    );

  if (!addr && command[0] === "s")
    return substituteCommand(
      forcedAddr || ".",
      command
    );

  if (!command)
    return printCommand(
      effectiveAddr || ".",
      false,
      false
    );

  if (
    command[0] === "g" ||
    command[0] === "v"
  ) {
    if (
      command[1] === "/" ||
      command[1] === "?"
    )
      return globalCommand(
        effectiveAddr || "1,$",
        command
      );
  }

  if (command[0] === "s")
    return substituteCommand(
      effectiveAddr || ".",
      command
    );

  if (
    command === "f" ||
    command.startsWith("f ")
  )
    return fileNameCommand(
      command.slice(1).trim()
    );

  if (
    command === "e" ||
    command === "e!" ||
    command.startsWith("e ") ||
    command.startsWith("e! ")
  )
    return editFileCommand(
      command.slice(1).trim()
    );

  if (
    command === "r" ||
    command.startsWith("r ")
  )
    return readFileCommand(
      effectiveAddr || ".",
      command.slice(1).trim()
    );

  if (
    command === "w" ||
    command.startsWith("w ")
  )
    return writeFileCommand(
      effectiveAddr,
      command.slice(1).trim()
    );

  const c = command[0];

  switch (c) {
    case "p": {
      const suffix = command.slice(1).trim();

      if (suffix)
        throw Error(`알 수 없는 명령입니다: ${code}`);

      return printCommand(
        effectiveAddr || ".",
        false,
        false
      );
    }

    case "n": {
      const suffix = command.slice(1).trim();

      if (suffix)
        throw Error(`알 수 없는 명령입니다: ${code}`);

      return printCommand(
        effectiveAddr || ".",
        true,
        false
      );
    }

    case "l": {
      const suffix = command.slice(1).trim();

      if (suffix)
        throw Error(`알 수 없는 명령입니다: ${code}`);

      return printCommand(
        effectiveAddr || ".",
        false,
        true
      );
    }

    case "d":
      if (command.slice(1).trim())
        throw Error(`알 수 없는 명령입니다: ${code}`);

      return deleteCommand(
        effectiveAddr || "."
      );

    case "j":
      if (command.slice(1).trim())
        throw Error(`알 수 없는 명령입니다: ${code}`);

      return joinCommand(
        effectiveAddr || null
      );

    case "i": {
      const rest = command.slice(1).trim();

      if (!rest)
        throw Error("insert 내용이 없습니다.");

      return insertCommand(
        effectiveAddr || ".",
        quoted(rest)
      );
    }

    case "a": {
      const rest = command.slice(1).trim();

      if (!rest)
        throw Error("append 내용이 없습니다.");

      return appendCommand(
        effectiveAddr || ".",
        quoted(rest)
      );
    }

    case "c": {
      const rest = command.slice(1).trim();

      if (!rest)
        throw Error("change 내용이 없습니다.");

      return changeCommand(
        effectiveAddr || ".",
        quoted(rest)
      );
    }

    case "t": {
      const rest = command.slice(1).trim();

      if (!rest)
        throw Error("copy 대상 주소가 없습니다.");

      return copyCommand(
        effectiveAddr || ".",
        rest
      );
    }

    case "m": {
      const rest = command.slice(1).trim();

      if (!rest)
        throw Error("move 대상 주소가 없습니다.");

      return moveCommand(
        effectiveAddr || ".",
        rest
      );
    }

    case "=": {
      const r = effectiveAddr
        ? getRange(effectiveAddr, ".")
        : {
            s: buffer.length,
            e: buffer.length
          };

      console.log(r.e);
      return current;
    }

    default:
      throw Error(`알 수 없는 명령입니다: ${code}`);
  }
}

function scanTopLevelSubstitute(text, start) {
  return scanSubstituteCommand(text, start);
}

function scanTopLevelGlobal(text, start) {
  const delimiter = text[start + 1];
  let p = start + 2;

  while (p < text.length) {
    const c = text[p];

    if (c === "\\") {
      p += 2;
      continue;
    }

    if (c === delimiter) {
      p++;
      break;
    }

    p++;
  }

  return text.length;
}

function splitTopLevelCommands(text) {
  const result = [];
  let start = 0;
  let p = 0;

  while (p < text.length) {
    const c = text[p];

    if (
      (
        c === "g" ||
        c === "v"
      ) &&
      p + 1 < text.length &&
      (
        text[p + 1] === "/" ||
        text[p + 1] === "?"
      ) &&
      (
        p === start ||
        /[\s,;]/.test(text[p - 1])
      )
    ) {
      p = scanTopLevelGlobal(text, p);
      continue;
    }

    if (c === "s" && p === start) {
      p = scanTopLevelSubstitute(text, p);
      continue;
    }

    if (
      (
        c === "/" ||
        c === "?"
      ) &&
      (
        p === start ||
        /[\s,;]/.test(text[p - 1])
      )
    ) {
      const delimiter = c;
      p++;

      while (p < text.length) {
        if (text[p] === "\\") {
          p += 2;
          continue;
        }

        if (text[p] === delimiter) {
          p++;
          break;
        }

        p++;
      }

      continue;
    }

    if (c === "\n") {
      const command =
        text.slice(start, p).trim();

      if (command)
        result.push(command);

      p++;
      start = p;
      continue;
    }

    p++;
  }

  const last = text.slice(start).trim();

  if (last)
    result.push(last);

  return result;
}

function runCode(code) {
  code = String(code ?? "");

  if (!code.trim())
    return;

  if (
    /^(font|syntax)\s*=/i.test(
      code.trim()
    )
  ) {
    try {
      runEditorSettingCommand(
        code.trim()
      );
    } catch (err) {
      log("Error: " + err.message);
    }

    return;
  }

  if (!code.trim())
    return;

  syncBuffer();

  const commands =
    splitTopLevelCommands(code);

  let result = current;

  try {
    for (const command of commands)
      result = execute(command);
      
    if (commands.length === 1 && commands[0] === "u")
      return result;

    commit();
    return result;
  } catch (err) {
    log("Error: " + err.message);
  }
}

window.ed = (strings, ...values) => {
  if (typeof strings === "string")
    return runCode(strings);

  return runCode(
    String.raw(strings, ...values)
  );
};

window.runCode = runCode;

window.addEventListener("keydown", e => {
  if (!editor)
    return;

  if (
    e.ctrlKey &&
    !e.shiftKey &&
    e.key.toLowerCase() === "z"
  )
    return;

  if (
    e.ctrlKey &&
    e.shiftKey &&
    e.key.toLowerCase() === "z"
  ) {
    e.preventDefault();

    editor.trigger(
      "keyboard",
      "redo",
      null
    );
  }

  if (
    e.ctrlKey &&
    !e.shiftKey &&
    e.key.toLowerCase() === "y"
  ) {
    e.preventDefault();

    editor.trigger(
      "keyboard",
      "redo",
      null
    );
  }
});

window.addEventListener(
  "beforeunload",
  function(e) {
    e.preventDefault();
    e.returnValue = "";
  }
);

function waitForEditorReady() {
  if (!editor) {
    requestAnimationFrame(
      waitForEditorReady
    );
    return;
  }

  console.log(
    "Monaco ed ready — help"
  );
}

waitForEditorReady();
